<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" fill="none">
  <!-- Band 2: Kronometre + Çalışma Takvimi + Planlama -->
  <rect width="600" height="440" rx="24" fill="#fdf0e4"/>
  <rect x="28" y="28" width="544" height="384" rx="20" fill="#ffffff" stroke="#dde1e4" stroke-width="1.5"/>

  <text x="56" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#a3430a">KRONOMETRE · TAKVİM · PLANLAMA</text>
