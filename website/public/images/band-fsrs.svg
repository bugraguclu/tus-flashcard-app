<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" fill="none">
  <!-- Band 1: FSRS-6 Forgetting Curve vs Passive Reading -->
  <rect width="600" height="440" rx="24" fill="#f3f5f6"/>
  <rect x="28" y="28" width="544" height="384" rx="20" fill="#ffffff" stroke="#dde1e4" stroke-width="1.5"/>
  <text x="56" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4" fill="#0e7469">FSRS-6 UNUTMA EĞRİSİ</text>
  <text x="56" y="92" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#24292c">Tam unutacağın gün tekrar et</text>

  <!-- Grid lines -->
  <line x1="68" y1="138" x2="540" y2="138" stroke="#e9ecee"/>
  <line x1="68" y1="192" x2="540" y2="192" stroke="#e9ecee" stroke-dasharray="5 5"/>
  <line x1="68" y1="246" x2="540" y2="246" stroke="#e9ecee"/>
  <line x1="68" y1="300" x2="540" y2="300" stroke="#dde1e4" stroke-width="1.5"/>

  <text x="56" y="142" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" fill="#596166">100%</text>
  <text x="56" y="196" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0e7469">90%</text>
  <text x="56" y="250" text-anchor="end" font-family="system-ui, sans-serif" font-size="10.5" fill="#596166">50%</text>

  <!-- Passive reading drop -->
  <path d="M74 140 Q135 245 250 282 T530 296" stroke="#b02c25" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <text x="380" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#b02c25">Pasif okuma (72 saatte hızlı düşüş)</text>

  <!-- FSRS-6 spaced repetition curve -->
  <path d="M74 140 Q112 184 134 190 L134 140 Q196 178 242 190 L242 140 Q330 172 394 190 L394 140 Q470 162 532 174" stroke="#0e7469" stroke-width="3.2" fill="none" stroke-linejoin="round"/>

  <!-- Review dots -->
  <circle cx="134" cy="140" r="6" fill="#0e7469" stroke="#ffffff" stroke-width="2"/>
  <circle cx="242" cy="140" r="6" fill="#0e7469" stroke="#ffffff" stroke-width="2"/>
  <circle cx="394" cy="140" r="6" fill="#0e7469" stroke="#ffffff" stroke-width="2"/>

  <text x="134" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#24292c">3. gün</text>
  <text x="242" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#24292c">11. gün</text>
  <text x="394" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#24292c">34. gün</text>
  <text x="518" y="324" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#0e7469">Sınav günü</text>

  <!-- Legend -->
  <rect x="56" y="348" width="488" height="44" rx="12" fill="#e4f4f1"/>
  <text x="74" y="375" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#0e7469">FSRS-6: Her kartta kararlılık (S) ve zorluk (D) ayrı hesaplanır → %90 hedef hatırlama</text>
</svg>
