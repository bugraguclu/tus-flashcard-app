name: Publish legal pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/privacy.html'
      - 'docs/support.html'
      - 'docs/terms.html'
      - 'docs/app-store/metadata-tr.md'
      - '.github/workflows/pages.yml'
      - 'scripts/legal-identity.mjs'
      - 'scripts/prepare-legal-pages.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check legal identity and GitHub Pages configuration
        id: readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-legal-pages.mjs

  # Legal identity and the Pages source are intentionally release prerequisites.
  # A missing prerequisite skips deployment; App Store verification still fails separately.
  deploy:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare legal pages
        run: |
          mkdir legal-pages
          cp docs/index.html docs/privacy.html docs/support.html docs/terms.html legal-pages/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload legal pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: legal-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
