name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A newly published advisory is not this change's fault: when package.json and the lockfile
      # are unchanged, report it as a warning instead of failing the run. Dependency changes, new
      # branches and Dependabot PRs still have to pass.
      - name: Verify dependency advisories
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != 0000000000000000000000000000000000000000 ] \
            && git fetch --quiet --depth=1 origin "$BASE_SHA" \
            && git diff --quiet "$BASE_SHA" HEAD -- package.json package-lock.json; then
            node scripts/audit-gate.mjs --warn-only
          else
            node scripts/audit-gate.mjs
          fi

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Run quality gate
        run: npm run quality

      - name: Build web production bundle
        run: npm run build:web
