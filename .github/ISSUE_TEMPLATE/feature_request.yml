name: Feature request
description: Suggest a focused product or developer improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: What user need or workflow should this improve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Relevant platform
      multiple: true
      options:
        - iOS
        - Android
        - Web
        - All platforms

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: Add related workflows, constraints, mockups, or examples.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing request before opening this issue.
          required: true
