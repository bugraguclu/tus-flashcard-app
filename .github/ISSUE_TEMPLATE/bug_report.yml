name: Bug report
description: Report a reproducible problem in TusAnkiM
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not attach personal health information, private study data, or copyrighted deck content.

  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
      placeholder: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - Web
        - Multiple platforms
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 1.0.0 or a commit SHA

  - type: textarea
    id: diagnostics
    attributes:
      label: Additional context
      description: Add sanitized logs, screenshots, or recordings if useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I removed private and copyrighted content from attachments.
          required: true
