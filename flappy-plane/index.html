<title>Flappy Plane</title>
<style>
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{height:100%;margin:0;background:#0d1018;overflow:hidden;
    font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  body{display:grid;place-items:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #stage{position:relative;width:min(96vw, calc(94svh * 420 / 640));aspect-ratio:420/640}
  canvas{width:100%;height:100%;display:block;border-radius:14px;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
    image-rendering:auto;touch-action:none;cursor:pointer}
  #topBar{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;z-index:4}
  #gear{width:34px;height:34px;border:0;border-radius:50%;
    background:rgba(0,0,0,.35);color:rgba(255,255,255,.85);font-size:17px;line-height:34px;cursor:pointer;padding:0;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);transition:all .15s;backdrop-filter:blur(4px)}
  #gear:hover{background:rgba(0,0,0,.6);transform:scale(1.05)}
  #shopBtn{height:34px;padding:0 11px;border:0;border-radius:17px;
    background:rgba(0,0,0,.35);color:#fff;font:700 13px inherit;cursor:pointer;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);transition:all .15s;backdrop-filter:blur(4px);
    display:inline-flex;align-items:center;gap:4px}
  #shopBtn:hover{background:rgba(0,0,0,.6);transform:scale(1.03)}
  #modal,#shopModal{position:absolute;inset:0;background:rgba(0,0,0,.52);border-radius:14px;
    display:grid;place-items:center;z-index:10;backdrop-filter:blur(3px)}
  #modal[hidden],#shopModal[hidden]{display:none}
  #settings{width:min(84%,300px);background:#e6dfa6;color:#4a3f16;border:3px solid #7d7237;
    border-radius:14px;padding:16px 18px;box-shadow:0 18px 40px rgba(0,0,0,.5);font-size:13px}
  #settings h3{margin:0 0 4px;font-size:19px;text-align:center;color:#c96b1f}
  #settings label{display:block;margin:12px 0}
  #settings label.row{display:flex;align-items:center;gap:8px;margin-top:16px;cursor:pointer}
  #settings b{float:right;font-weight:700;font-variant-numeric:tabular-nums}
  #settings input[type=range]{width:100%;margin-top:6px;accent-color:#c96b1f;cursor:pointer}
  #settings input[type=checkbox]{accent-color:#c96b1f;width:16px;height:16px;cursor:pointer}
  #sClose{width:100%;margin-top:16px;padding:9px;border:0;border-radius:8px;background:#c96b1f;
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  #sClose:hover{background:#b25c14}
  .save-wrap{margin-top:14px;padding-top:12px;border-top:1px dashed #b9ad6a}
  .save-wrap h4{margin:0 0 4px;font-size:14px;color:#7d5a12}
  .save-wrap p{margin:0 0 8px;font-size:11.5px;line-height:1.45;color:#6b5c28}
  .save-row{display:flex;gap:6px}
  .save-row button{flex:1;padding:8px 6px;border:0;border-radius:8px;background:#7d7237;color:#fff;
    font:700 12px inherit;cursor:pointer;transition:background .15s}
  .save-row button:hover{background:#655c27}
  #saveCode{width:100%;margin-top:8px;height:58px;resize:vertical;border:2px solid #b9ad6a;border-radius:8px;
    padding:6px 8px;font:600 10.5px ui-monospace,Menlo,Consolas,monospace;color:#4a3f16;background:#f6f0c9;
    word-break:break-all}
  #installBtn{width:100%;margin-top:10px;padding:9px;border:0;border-radius:8px;background:#2b7a3f;color:#fff;
    font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
  #installBtn:hover{background:#22622f}
  .reset-wrap{margin-top:14px;padding-top:12px;border-top:1px dashed #b9ad6a}
  #sReset{width:100%;padding:9px;border:0;border-radius:8px;background:#c1301e;color:#fff;
    font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;transition:background .15s}
  #sReset:hover{background:#9d2313}
  #shop{width:min(92%,350px);max-height:92%;overflow:auto;background:#e6dfa6;color:#4a3f16;
    border:3px solid #7d7237;border-radius:14px;padding:14px 16px;box-shadow:0 18px 40px rgba(0,0,0,.5)}
  #shop h3{margin:0;font-size:19px;text-align:center;color:#c96b1f;display:flex;justify-content:space-between;align-items:center}
  #shopCoins{font-size:15px;color:#5a4a1e;background:#f6f0c9;border:2px solid #b9ad6a;
    border-radius:13px;padding:3px 11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-variant-numeric:tabular-nums;letter-spacing:.2px;white-space:nowrap}
  .coin{width:15px;height:15px;border-radius:50%;flex:0 0 auto;
    background:radial-gradient(circle at 33% 27%, #fff6cf 0%, #ffc93c 52%, #dd8a00 100%);
    box-shadow:inset 0 0 0 1.5px rgba(116,64,0,.55), inset 0 -2px 3px rgba(150,86,0,.35)}
  #shopCoins::before{content:'';display:inline-block;width:15px;height:15px;border-radius:50%;
    flex:0 0 auto;vertical-align:middle;
    background:radial-gradient(circle at 33% 27%, #fff6cf 0%, #ffc93c 52%, #dd8a00 100%);
    box-shadow:inset 0 0 0 1.5px rgba(116,64,0,.55), inset 0 -2px 3px rgba(150,86,0,.35)}
  .card .pr.cost, .pr.cost, .tint span.cost{display:inline-flex;align-items:center;justify-content:center;gap:4px;
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .card .pr.cost::before, .pr.cost::before, .tint span.cost::before{content:'';display:inline-block;width:11px;height:11px;
    border-radius:50%;flex:0 0 auto;vertical-align:middle;
    background:radial-gradient(circle at 33% 27%, #fff6cf 0%, #ffc93c 52%, #dd8a00 100%);
    box-shadow:inset 0 0 0 1.2px rgba(116,64,0,.5)}
  .sect{margin:12px 0 6px;font-size:12px;letter-spacing:1px;color:#8a7c3a;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{position:relative;padding:0;border:2px solid #b9ad6a;border-radius:12px;background:#f6f0c9;cursor:pointer;
    overflow:hidden;font:inherit;color:inherit;text-align:center;transition:transform .15s,border-color .15s,box-shadow .15s;
    display:flex;flex-direction:column}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.15)}
  .card .preview-wrap{position:relative;width:100%;aspect-ratio:150/98;background:#55a8c9;overflow:hidden}
  .card canvas{display:block;width:100%;height:100%}
  .card .info{padding:5px 6px 7px;display:flex;flex-direction:column;flex:1;justify-content:space-between}
  .card .nm{display:block;font-weight:800;font-size:12.5px;color:#4a3f16;line-height:1.2}
  .card .desc{display:block;font-size:10px;color:#857538;margin:2px 0 4px;font-style:italic;line-height:1.2}
  .card .pr{display:flex;align-items:center;justify-content:center;gap:4px;
    font-size:11.5px;font-weight:700;color:#8a7c3a;margin-top:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
  .card.owned .pr{color:#2e8540}
  .card.active{border-color:#c96b1f;box-shadow:0 0 0 2px rgba(201,107,31,.45);background:#fff9e0}
  .card.active .pr{color:#c96b1f;font-weight:800}
  .card .badge{position:absolute;top:5px;left:5px;font-size:8.5px;font-weight:800;letter-spacing:.3px;
    padding:2px 5px;border-radius:6px;color:#fff;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);z-index:2}
  .card .badge.gold{background:linear-gradient(135deg,#c96b1f,#e5a823);color:#fff;box-shadow:0 2px 5px rgba(0,0,0,.25)}
  .card .badge.red{background:linear-gradient(135deg,#e63946,#c1121f)}
  .card .badge.blue{background:linear-gradient(135deg,#0077b6,#0096c7)}
  .card .badge.green{background:linear-gradient(135deg,#2b9348,#55a630)}
  .card .badge.cyan{background:linear-gradient(135deg,#00b4d8,#0077b6);color:#fff;box-shadow:0 2px 6px rgba(0,180,216,.4)}
  .card .badge.diamond{background:linear-gradient(135deg,#00e5ff,#7c4dff);color:#fff;box-shadow:0 2px 7px rgba(0,229,255,.5)}
  .card .lock-icon{position:absolute;top:5px;right:5px;font-size:11px;width:20px;height:20px;
    border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;
    justify-content:center;backdrop-filter:blur(3px);z-index:2}
  .card .lock-icon[hidden], .card.owned .lock-icon{display:none !important}
  .card .badge[hidden]{display:none !important}
  .card.legend{border-color:#d4af37;background:linear-gradient(155deg,#fffbf0,#faeec4);box-shadow:0 4px 12px rgba(212,175,55,.25)}
  .card.legend:hover{box-shadow:0 8px 20px rgba(212,175,55,.4)}
  .card.legend.active{border-color:#c96b1f;box-shadow:0 0 0 2px rgba(201,107,31,.5), 0 6px 18px rgba(216,163,37,.45)}
  .card.legend .pr{color:#9e6a00;font-weight:800}
  .card.legend.locked .pr{color:#b33927;font-weight:800}
  .card.legend.diamond{border-color:#38bdf8;background:linear-gradient(155deg,#f0fdfa,#e0f2fe);box-shadow:0 4px 14px rgba(56,189,248,.35)}
  .card.legend.diamond:hover{box-shadow:0 8px 22px rgba(56,189,248,.5)}
  .card.legend.diamond.active{border-color:#0284c7;box-shadow:0 0 0 2px rgba(2,132,199,.5), 0 6px 20px rgba(56,189,248,.55)}
  .card.legend.diamond .pr{color:#0284c7;font-weight:800}
  .card.legend.diamond.locked .pr{color:#b33927;font-weight:800}
  .tints{display:flex;flex-wrap:wrap;gap:7px}
  .tints.disabled{opacity:.4;pointer-events:none}
  .tint{width:51px;padding:5px 0 4px;border:2px solid #b9ad6a;border-radius:10px;background:#f6f0c9;
    cursor:pointer;font:inherit;color:#8a7c3a;text-align:center;transition:all .15s}
  .tint:hover{transform:translateY(-1px)}
  .tint i{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;
    background:var(--c);box-shadow:inset 0 -4px 6px rgba(0,0,0,.25),0 0 0 2px rgba(0,0,0,.15)}
  .tint span{display:flex;align-items:center;justify-content:center;gap:3px;
    font-size:10px;font-weight:700;white-space:nowrap}
  .tint.owned span{color:#4a8a2c}
  .tint.active{border-color:#c96b1f;box-shadow:0 0 0 2px rgba(201,107,31,.35);background:#fff9e0}
  .tint.diamond-tint{border-color:#38bdf8;background:linear-gradient(155deg,#ffffff,#e0f2fe)}
  .tint.diamond-tint:hover{box-shadow:0 4px 10px rgba(56,189,248,.4)}
  .tint.diamond-tint.active{border-color:#0284c7;box-shadow:0 0 0 2px rgba(2,132,199,.45),0 4px 12px rgba(56,189,248,.5);background:#f0f9ff}

  #tintNote{margin-top:9px;font-size:11.5px;font-weight:700;color:#c96b1f;text-align:center;
    background:#fff5db;border:1.5px dashed #e0a340;border-radius:8px;padding:5px 8px}

  /* Toast Notification */
  .toast{position:absolute;top:54px;left:50%;transform:translateX(-50%);

    padding:8px 18px;font-size:13px;font-weight:700;z-index:30;box-shadow:0 12px 32px rgba(0,0,0,0.65);
    display:flex;align-items:center;gap:8px;pointer-events:none;backdrop-filter:blur(8px);

<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="topBar">

        <input id="sMaster" type="range" min="0" max="100" step="5" value="70"></label>
      <label>Efektler <b id="vSfx">80%</b>
        <input id="sSfx" type="range" min="0" max="100" step="5" value="80"></label>

        <input id="sMusic" type="range" min="0" max="100" step="5" value="35"></label>
      <label class="row"><input id="sMute" type="checkbox"> Tümünü sustur (M)</label>

      <div class="save-wrap">

           ya da tarayıcı verilerini silmeden önce yedek kodunu alıp saklaman yeterli.</p>

                  spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>

        <button id="sReset" title="Tüm rekorları, açılan kostümleri ve coinleri sıfırla">🗑️ Tüm İlerlemeyi Sıfırla</button>
      </div>
      <button id="sClose">Kapat</button>
    </div>
  </div>
</div>
<script>
/* ============================ CANVAS ============================ */
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const W = 420, H = 640, GROUND_H = 96, SKY_H = H - GROUND_H;
/* Arka tampon ekrandaki GERCEK boyuta gore kurulur; buyuk ekranda goruntu esnemez. */
let needFit = false;
const markFit = () => { needFit = true; };
function fit(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const cssW = cvs.clientWidth || W;
  const k  = Math.max(1, Math.min(3, (cssW * dpr) / W));
  const bw = Math.round(W*k), bh = Math.round(H*k);
  if (cvs.width !== bw || cvs.height !== bh){ cvs.width = bw; cvs.height = bh; }
  ctx.setTransform(k,0,0,k,0,0);
}
addEventListener('resize', markFit);
if (window.ResizeObserver) new ResizeObserver(markFit).observe(cvs);
fit();

/* ============================ YARDIMCI ============================ */
const rnd   = (a,b)=> a + Math.random()*(b-a);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} },
  remove(k){ try { localStorage.removeItem(k); } catch(e){} }
};

// Bütün ilerlemeyi sıfırlama (Altın/Elmas Mekik ve Elmas rengi dengesi için temizleme)
const RESET_REV = 'flappy.reset_rev_2026_09_v3';
if (store.get(RESET_REV) !== '1') {
  store.remove('flappy.wallet');
  store.remove('flappy.best');
  store.remove('flappy.hellMode');
  store.set(RESET_REV, '1');
}
store.remove('flappy.hellMode');
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const TAU = Math.PI*2;

/* ============================ DÜNYA ============================ */
const SPEED = 132;              // px/sn yatay akış
let dist = 0;                   // toplam kat edilen mesafe
let t = 0;                      // toplam süre

// --- bulutlar
const CLOUD_SPAN = W + 260;
const clouds = [];
for (let i=0;i<8;i++) clouds.push({ x: rnd(0,CLOUD_SPAN), y: rnd(34,240), s: rnd(.5,1.2), a: rnd(.45,.85) });

// --- şehir silüeti (kusursuz döngü için sabit genişlikte üretilir)
const BSPAN = W*2;
const buildings = [];
(function(){
  let x = 0;
  while (x < BSPAN - 20){
    const w = Math.round(rnd(30,66));
    const h = Math.round(rnd(64,186));
    buildings.push({ x, w:Math.min(w, BSPAN-x), h, win: Math.random()<.75, tower: Math.random()<.22 });
    x += w + Math.round(rnd(5,16));
  }
})();

// --- çalılar
const HSPAN = W*2;
const bushes = [];
(function(){
  let x = 0;
  while (x < HSPAN){ const r = rnd(22,46); bushes.push({ x, r }); x += r*rnd(.85,1.35); }
})();

/* ============================ KUŞ ============================ */
const bird = { x: 126, y: SKY_H*0.46, vy: 0, rot: 0, wing: 0 };

/* ============================ KARAKTERLER ============================ */
/* Her çizim fonksiyonu merkeze (0,0) çizer; döndürmeyi sarmalayıcı yapar.
   Çarpışma kutusu tüm karakterlerde aynı (BIRD_RX/RY) — kostüm oynanışı değiştirmez. */

function artPlane(d, spin, boost, C){
  d.lineJoin = 'round'; d.lineCap = 'round'; d.lineWidth = 2; d.strokeStyle = C.ink;

  // Çift egzoz dumanı / itki izi
  if (boost > 0){
    for (let i = 0; i < 4; i++){
      d.globalAlpha = boost * 0.45 * (1 - i/4.5);
      d.fillStyle = '#edf2f7';
      d.beginPath();
      d.arc(-25 - i*10, 2.5 + Math.sin(spin*2.5 + i)*2, 5.5 - i*1.0, 0, TAU);
      d.fill();
    }
    d.globalAlpha = 1;
  }

  // Uzak kanat (derinlik & kanat esnemesi)
  const farFlex = Math.sin(spin*2.8)*1.2 - boost*2.4;
  d.fillStyle = C.deep;
  d.beginPath();
  d.moveTo(4, -1);
  d.lineTo(-6, -12 + farFlex);
  d.lineTo(3, -12 + farFlex);
  d.lineTo(12, -2);
  d.closePath(); d.fill();

  // Dikey kuyruk dümeni
  d.fillStyle = C.main;
  d.beginPath();
  d.moveTo(-9, -4); d.lineTo(-15, -19); d.lineTo(-11, -19);
  d.quadraticCurveTo(-6, -12, -3, -4);
  d.closePath(); d.fill(); d.stroke();
  d.fillStyle = C.pale;
  d.beginPath(); d.moveTo(-11, -8); d.lineTo(-13, -16); d.lineTo(-10.5, -16); d.closePath(); d.fill();

  // Yanıp sönen kuyruk flaşörü (Strobe beacon)
  const strobe = Math.sin(spin * 6.5) > 0.25;
  d.fillStyle = strobe ? '#ff3b30' : '#701010';
  d.beginPath(); d.arc(-13, -19, 1.8, 0, TAU); d.fill();

  // Yatay denge dümeni
  d.fillStyle = C.dark;
  d.beginPath(); d.moveTo(-9, 0); d.lineTo(-23, 3); d.lineTo(-22, 6); d.lineTo(-9, 7); d.closePath(); d.fill(); d.stroke();

  // Aerodinamik gövde
  d.beginPath();
  d.moveTo(19, 0);
  d.quadraticCurveTo(17.5, -9, 3, -10.5);
  d.quadraticCurveTo(-12, -10.5, -19, -1.5);
  d.quadraticCurveTo(-12, 8.5, 3, 9.5);
  d.quadraticCurveTo(17.5, 8, 19, 0);
  d.closePath();
  const bg = d.createLinearGradient(0, -11, 0, 11);
  bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.42, '#e9edf1');
  bg.addColorStop(0.78, '#c2c9d1'); bg.addColorStop(1, '#98a2ad');
  d.fillStyle = bg; d.fill();
  d.save(); d.clip();
  d.fillStyle = C.main; d.fillRect(-24, 0.5, 48, 3.6);
  d.fillStyle = C.dark; d.fillRect(-24, 4.1, 48, 1.4);
  d.fillStyle = 'rgba(255,255,255,.8)'; d.fillRect(-24, -8.6, 48, 2.4);
  d.fillStyle = 'rgba(30,45,65,.55)';
  for (let wx = -11; wx < 3; wx += 6){ d.beginPath(); d.roundRect(wx, -6, 3.6, 3.6, 1.2); d.fill(); }
  d.strokeStyle = 'rgba(60,72,86,.45)'; d.lineWidth = 1;
  d.beginPath(); d.roundRect(7, -7, 6, 11, 2); d.stroke();
  d.restore();
  d.strokeStyle = C.ink; d.lineWidth = 2;
  d.beginPath();
  d.moveTo(19, 0);
  d.quadraticCurveTo(17.5, -9, 3, -10.5);
  d.quadraticCurveTo(-12, -10.5, -19, -1.5);
  d.quadraticCurveTo(-12, 8.5, 3, 9.5);
  d.quadraticCurveTo(17.5, 8, 19, 0);
  d.closePath(); d.stroke();

  // Yakın kanat (çırpma esnemesi)
  const nearFlex = Math.sin(spin*2.8)*1.5 + boost*3.2;
  d.fillStyle = C.main;
  d.beginPath();
  d.moveTo(7, 3);
  d.lineTo(-9, 16 + nearFlex);
  d.lineTo(3, 16.5 + nearFlex);
  d.lineTo(15, 4.5);
  d.closePath(); d.fill(); d.stroke();
  d.fillStyle = 'rgba(255,255,255,.4)';
  d.beginPath();
  d.moveTo(7, 3);
  d.lineTo(-6, 14 + nearFlex);
  d.lineTo(-1, 14.5 + nearFlex);
  d.lineTo(12, 4);
  d.closePath(); d.fill();

  // Kokpit ve cam parıltısı
  d.fillStyle = C.glass;
  d.beginPath(); d.ellipse(9, -5.4, 6.2, 4, -0.12, 0, TAU); d.fill(); d.stroke();
  d.fillStyle = 'rgba(255,255,255,.75)';
  d.beginPath(); d.ellipse(7.4, -6.4, 2.6, 1.4, -0.12, 0, TAU); d.fill();

  // Burun konisi ve pervane
  d.save(); d.translate(19, 0);
  const cone = d.createLinearGradient(0, -4, 0, 4);
  cone.addColorStop(0, C.light); cone.addColorStop(1, C.deep);
  d.fillStyle = cone; d.strokeStyle = C.ink; d.lineWidth = 1.8;
  d.beginPath(); d.moveTo(-1, -4.4); d.quadraticCurveTo(5, -2.4, 6.6, 0);
  d.quadraticCurveTo(5, 2.4, -1, 4.4); d.closePath(); d.fill(); d.stroke();
  d.translate(6.6, 0);

  // Dönen pervane hareket bulanıklığı diski
  d.fillStyle = 'rgba(215,232,248,.25)';
  d.beginPath(); d.ellipse(0, 0, 3.2, 14, 0, 0, TAU); d.fill();
  const sp = Math.sin(spin * 5.2);
  d.strokeStyle = '#4a5560'; d.lineWidth = 2.4;
  d.beginPath(); d.moveTo(0, -13.5 * sp); d.lineTo(0, 13.5 * sp); d.stroke();

  // Pervane göbek vidası
  const cg = d.createRadialGradient(-0.5, -0.5, 0.4, 0, 0, 2.6);
  cg.addColorStop(0, '#ffffff'); cg.addColorStop(1, '#2c343b');
  d.fillStyle = cg; d.beginPath(); d.arc(0, 0, 2.5, 0, TAU); d.fill();
  d.restore();
}

/* ==================== SARI KUŞ (ORİJİNAL KLASİK FLAPPY) ==================== */
function artClassicBird(d, spin, boost, C){
  d.lineJoin = 'round'; d.lineCap = 'round'; d.lineWidth = 2; d.strokeStyle = C.ink;
  const flapCycle = Math.sin(spin * 3.6);
  const flapAngle = flapCycle * 0.55 - boost * 0.65;
  const blink = clamp((Math.sin(spin * 0.38) - 0.965) / 0.035, 0, 1);

  // Kuyruk tüyleri
  d.save(); d.translate(-14, 2); d.rotate(Math.sin(spin * 2.2) * 0.18);
  d.fillStyle = C.dark;
  d.beginPath();
  d.moveTo(0, -3); d.lineTo(-8, -7); d.lineTo(-5, -2);
  d.lineTo(-10, 0); d.lineTo(-5, 2);
  d.lineTo(-7, 6); d.lineTo(0, 3);
  d.closePath(); d.fill(); d.stroke();
  d.restore();

  // Tombul gövde
  d.beginPath();
  d.ellipse(0, 0, 15.5, 12.8, -0.08, 0, TAU);
  const bg = d.createRadialGradient(-3, -5, 3, 0, 0, 16);
  bg.addColorStop(0, mix(C.light, '#ffffff', 0.42));
  bg.addColorStop(0.55, C.main);
  bg.addColorStop(1, C.dark);
  d.fillStyle = bg; d.fill(); d.stroke();

  // Karın açık renk göbek
  d.save(); d.beginPath(); d.ellipse(0, 0, 15.5, 12.8, -0.08, 0, TAU); d.clip();
  d.fillStyle = mix(C.pale, '#ffffff', 0.48);
  d.beginPath(); d.ellipse(3, 7, 13, 7.5, 0.15, 0, TAU); d.fill();
  // Sevimli pembe yanak allığı
  d.fillStyle = 'rgba(255, 100, 120, 0.38)';
  d.beginPath(); d.ellipse(5, 3, 4.2, 2.8, 0, 0, TAU); d.fill();
  d.restore();

  // Büyük karikatür göz
  const eyeX = 7, eyeY = -4;
  d.fillStyle = '#ffffff'; d.strokeStyle = C.ink; d.lineWidth = 2;
  d.beginPath(); d.arc(eyeX, eyeY, 6.2, 0, TAU); d.fill(); d.stroke();
  // Göz bebeği
  d.fillStyle = '#1a1a24';
  d.beginPath(); d.ellipse(eyeX + 1.8, eyeY, 2.6, 3.8, 0, 0, TAU); d.fill();
  // Parıltı noktaları
  d.fillStyle = '#ffffff';
  d.beginPath(); d.arc(eyeX + 2.8, eyeY - 1.4, 1.3, 0, TAU); d.fill();
  d.beginPath(); d.arc(eyeX + 1.1, eyeY + 1.6, 0.8, 0, TAU); d.fill();
  // Göz kırpma kapağı
  if (blink > 0){
    d.fillStyle = C.main;
    d.beginPath(); d.ellipse(eyeX, eyeY - 5.5 + blink*5.5, 6.2, 6.2*blink, 0, 0, TAU); d.fill();
    d.strokeStyle = C.ink; d.lineWidth = 1.6;
    d.beginPath(); d.arc(eyeX, eyeY, 6.2, Math.PI, TAU); d.stroke();
  }

  // İkonik tombul gaga (dudaklar)
  d.fillStyle = '#ff5722'; d.strokeStyle = C.ink; d.lineWidth = 1.8;
  d.beginPath();
  d.moveTo(10, -1);
  d.quadraticCurveTo(18, -2, 21, 1);
  d.quadraticCurveTo(18, 4, 10, 3);
  d.closePath(); d.fill(); d.stroke();
  d.fillStyle = 'rgba(255,255,255,0.45)';
  d.beginPath(); d.ellipse(15, 0, 3.2, 1, 0.1, 0, TAU); d.fill();
  d.fillStyle = '#e64a19';
  d.beginPath();
  d.moveTo(10, 3);
  d.quadraticCurveTo(16, 4, 18, 6.5);
  d.quadraticCurveTo(14, 8, 8, 5.5);
  d.closePath(); d.fill(); d.stroke();

  // Çırpan kanat (önde)
  d.save();
  d.translate(-3, 1.5);
  d.rotate(flapAngle);
  d.fillStyle = C.main; d.strokeStyle = C.ink; d.lineWidth = 2;
  d.beginPath();
  d.moveTo(4, -4);
  d.quadraticCurveTo(-11, -9, -15, -1);
  d.quadraticCurveTo(-13, 7, -5, 10);
  d.quadraticCurveTo(4, 7, 5, -2);
  d.closePath(); d.fill(); d.stroke();
  d.fillStyle = mix(C.light, '#ffffff', 0.35);
  d.beginPath();
  d.moveTo(0, -3);
  d.quadraticCurveTo(-8, -6, -11, 0);
  d.quadraticCurveTo(-5, 4, 1, -1);
  d.closePath(); d.fill();
  d.restore();
}

/* ==================== TUS DOKTORU (MASUM HEKİM KUŞ) ==================== */
function artDoctor(d, spin, boost, C){
  d.lineJoin = 'round'; d.lineCap = 'round'; d.lineWidth = 2; d.strokeStyle = C.ink;
  const flapAngle = Math.sin(spin * 3.4) * 0.52 - boost * 0.62;
  const bounce = Math.sin(spin * 2.8) * 1.5;

  // Dikey ibik tüyleri (kafa tepesi)
  d.fillStyle = C.dark;
  d.beginPath();
  d.moveTo(0, -12); d.quadraticCurveTo(2, -18, 5, -19); d.quadraticCurveTo(4, -14, 3, -11); d.closePath(); d.fill();

  // Kuş gövdesi
  d.beginPath(); d.ellipse(0, 0, 15, 12.5, -0.08, 0, TAU);
  const bg = d.createLinearGradient(0, -12, 0, 13);
  bg.addColorStop(0, mix(C.light, '#ffffff', 0.4));
  bg.addColorStop(1, C.main);
  d.fillStyle = bg; d.fill(); d.stroke();

  // BEYAZ DOKTOR ÖNLÜĞÜ
  d.save(); d.beginPath(); d.ellipse(0, 0, 15, 12.5, -0.08, 0, TAU); d.clip();
  d.fillStyle = '#f8fafc';
  d.beginPath();
  d.moveTo(-15, -1); d.lineTo(15, -1); d.lineTo(15, 13); d.lineTo(-15, 13); d.closePath();
  d.fill();
  // Önlük dikiş hattı ve yakalar
  d.strokeStyle = '#cbd5e1'; d.lineWidth = 1.2;
  d.beginPath(); d.moveTo(0, -1); d.lineTo(0, 13); d.stroke();
  d.fillStyle = '#ffffff'; d.strokeStyle = '#94a3b8';
  d.beginPath(); d.moveTo(-4, -1); d.lineTo(0, 4); d.lineTo(-8, 3); d.closePath(); d.fill(); d.stroke();
  d.beginPath(); d.moveTo(4, -1); d.lineTo(0, 4); d.lineTo(8, 3); d.closePath(); d.fill(); d.stroke();
  // Kırmızı acil tıp haçı (+) cebi
  d.fillStyle = '#e2e8f0'; d.fillRect(4, 5, 7, 6);
  d.fillStyle = '#e63946';
  d.fillRect(6.5, 6.2, 2, 3.6);
  d.fillRect(5.7, 7, 3.6, 2);
  d.restore();
  d.strokeStyle = C.ink; d.lineWidth = 2;
  d.beginPath(); d.ellipse(0, 0, 15, 12.5, -0.08, 0, TAU); d.stroke();

  // Doktor gözlükleri ve gözler
  const eyeX = 6, eyeY = -4;
  d.fillStyle = '#ffffff';
  d.beginPath(); d.arc(eyeX, eyeY, 5.5, 0, TAU); d.fill(); d.stroke();
  d.fillStyle = '#1e293b';
  d.beginPath(); d.arc(eyeX + 1.6, eyeY, 2.4, 0, TAU); d.fill();
  d.fillStyle = '#ffffff';
  d.beginPath(); d.arc(eyeX + 2.4, eyeY - 1.2, 1, 0, TAU); d.fill();
  // Yuvarlak altın gözlük çerçevesi
  d.strokeStyle = '#d97706'; d.lineWidth = 1.4;
  d.beginPath(); d.arc(eyeX, eyeY, 6.2, 0, TAU); d.stroke();
  d.beginPath(); d.moveTo(eyeX - 6.2, eyeY); d.lineTo(-3, eyeY - 1); d.stroke();

  // Gaga
  d.fillStyle = '#f59e0b'; d.strokeStyle = C.ink; d.lineWidth = 1.6;
  d.beginPath(); d.moveTo(9, -2); d.lineTo(17, 0.5); d.lineTo(9, 3); d.closePath(); d.fill(); d.stroke();

  // ALIN AYNASI (Doctor's Head Reflector Mirror)
  d.save();
  d.translate(7, -11);
  d.rotate(-0.15);
  d.strokeStyle = '#334155'; d.lineWidth = 1.8;
  d.beginPath(); d.arc(-7, 4, 10, -0.6, 0.4); d.stroke();
  const mg = d.createRadialGradient(-1, -1, 0.5, 0, 0, 5.5);
  mg.addColorStop(0, '#ffffff'); mg.addColorStop(0.65, '#cbd5e1'); mg.addColorStop(1, '#64748b');
  d.fillStyle = mg; d.strokeStyle = '#1e293b'; d.lineWidth = 1.5;
  d.beginPath(); d.arc(0, 0, 5.2, 0, TAU); d.fill(); d.stroke();
  d.fillStyle = '#0f172a'; d.beginPath(); d.arc(0, 0, 1.4, 0, TAU); d.fill();
  if (Math.sin(spin * 4) > 0.35){
    d.fillStyle = 'rgba(255,255,255,0.9)';
    d.beginPath(); d.arc(-2, -2, 1.3, 0, TAU); d.fill();
  }
  d.restore();

  // STETESKOP (Boyundan sarkan ve rüzgarda sallanan)
  d.strokeStyle = '#0284c7'; d.lineWidth = 2.2;
  d.beginPath();
  d.moveTo(1, -2);
  d.quadraticCurveTo(-6, 3, -4, 9 + bounce*0.3);
  d.quadraticCurveTo(0, 12 + bounce*0.5, 5, 8 + bounce);
  d.stroke();
  // Steteskop diyaframı (chest piece)
  const dg = d.createRadialGradient(5, 8 + bounce, 0.5, 5, 8 + bounce, 3.2);
  dg.addColorStop(0, '#f8fafc'); dg.addColorStop(1, '#64748b');
  d.fillStyle = dg; d.strokeStyle = '#1e293b'; d.lineWidth = 1.4;
  d.beginPath(); d.arc(5, 8 + bounce, 3, 0, TAU); d.fill(); d.stroke();

  // Beyaz önlük kolu şeklinde çırpan kanat
  d.save();
  d.translate(-3, 2);
  d.rotate(flapAngle);
  d.fillStyle = '#ffffff'; d.strokeStyle = C.ink; d.lineWidth = 2;
  d.beginPath();
  d.moveTo(3, -4);
  d.quadraticCurveTo(-11, -8, -14, -1);
  d.quadraticCurveTo(-12, 7, -4, 9);
  d.quadraticCurveTo(4, 6, 4, -2);
  d.closePath(); d.fill(); d.stroke();
  d.strokeStyle = '#0284c7'; d.lineWidth = 1.8;
  d.beginPath(); d.moveTo(-10, 3); d.lineTo(-5, 6); d.stroke();
  d.restore();
}

/* ==================== KURBAĞA ==================== */
function artFrog(d, spin, boost, C){
  d.lineJoin = 'round'; d.lineCap = 'round'; d.lineWidth = 2; d.strokeStyle = C.ink;
  const kick  = Math.sin(spin*1.8)*0.26 + boost*0.65;
  const blink = clamp((Math.sin(spin*0.42) - 0.965)/0.035, 0, 1);

  d.save();
  d.scale(1 - boost*0.05, 1 + boost*0.07);

  [-1, 1].forEach(sy => {
    d.save(); d.translate(-7, 4.5*sy); d.rotate(sy*(0.42 + kick));
    d.fillStyle = C.dark;
    d.beginPath(); d.ellipse(-5,0,10,5.2,0,0,TAU); d.fill(); d.stroke();
    d.save(); d.translate(-12,1.5); d.rotate(-0.55 - kick*0.5);
    d.fillStyle = C.deep;
    d.beginPath(); d.ellipse(-4,0,6.5,3.4,0,0,TAU); d.fill(); d.stroke();
    d.fillStyle = C.dark;
    d.beginPath(); d.moveTo(-8,0);
    d.lineTo(-15,-4); d.lineTo(-16,-1); d.lineTo(-16.5,2); d.lineTo(-14,4);
    d.closePath(); d.fill(); d.stroke();
    d.restore(); d.restore();
  });

  d.beginPath();
  d.moveTo(17,2);
  d.quadraticCurveTo(17,-9,6,-11);  d.quadraticCurveTo(-8,-13,-16,-6);
  d.quadraticCurveTo(-21,-1,-16,7); d.quadraticCurveTo(-6,14,7,12);
  d.quadraticCurveTo(16,10,17,2);
  d.closePath();
  const bg = d.createLinearGradient(0,-13,0,14);
  bg.addColorStop(0,C.light); bg.addColorStop(.5,C.main); bg.addColorStop(1,C.deep);
  d.fillStyle = bg; d.fill(); d.stroke();

  d.save(); d.clip();
  d.fillStyle = mix(C.pale,'#fff8dc',0.5);
  d.beginPath(); d.ellipse(2,10,14,6.5,0,0,TAU); d.fill();
  d.fillStyle = 'rgba(255,255,255,.35)';
  d.beginPath(); d.ellipse(-2,-9,12,3.2,-0.1,0,TAU); d.fill();
  d.fillStyle = C.deep;
  d.beginPath(); d.ellipse(-3,-4,3.5,2.2,0.3,0,TAU); d.fill();
  d.beginPath(); d.ellipse(-11,1,3,2,-0.2,0,TAU); d.fill();
  d.beginPath(); d.ellipse(4,-6,2.6,1.7,0.15,0,TAU); d.fill();
  d.restore();

  const sac = 3.5 + boost*3.5;
  d.fillStyle = mix(C.pale,'#ffe9a8',0.45);
  d.beginPath(); d.ellipse(9,8.5,6.5,sac,0.1,0,TAU); d.fill(); d.stroke();

  d.fillStyle = C.dark;
  d.save(); d.translate(12,10); d.rotate(Math.sin(spin*2.4)*0.18);
  d.beginPath(); d.ellipse(0,0,5,2.8,0.25,0,TAU); d.fill(); d.stroke();
  d.strokeStyle = C.ink; d.lineWidth = 1.3;
  for (let k=-1;k<2;k++){ d.beginPath(); d.moveTo(3.5,0); d.lineTo(7,k*2.2); d.stroke(); }
  d.restore();
  d.lineWidth = 2;

  d.strokeStyle = C.ink; d.lineWidth = 2.2;
  d.beginPath(); d.arc(4,0,11,0.12,1.02); d.stroke();
  d.fillStyle = C.ink;
  d.beginPath(); d.arc(13,-4,1,0,TAU); d.fill();
  d.beginPath(); d.arc(11,-6.5,1,0,TAU); d.fill();

  [[-2,-13],[10,-11.5]].forEach(e => {
    d.fillStyle = C.main; d.strokeStyle = C.ink; d.lineWidth = 2;
    d.beginPath(); d.arc(e[0],e[1],7.4,0,TAU); d.fill(); d.stroke();
    d.fillStyle = mix(C.light,'#ffffff',0.4);
    d.beginPath(); d.arc(e[0]-0.6,e[1]-1.2,6.2,Math.PI,TAU); d.fill();
    d.fillStyle = '#fdfdf5';
    d.beginPath(); d.arc(e[0]+0.5,e[1]-0.3,4.8,0,TAU); d.fill();
    d.fillStyle = '#c9a227';
    d.beginPath(); d.arc(e[0]+1.4,e[1]-0.2,3.4,0,TAU); d.fill();
    d.fillStyle = '#16210c';
    d.beginPath(); d.ellipse(e[0]+1.8,e[1]-0.2,1.5,2.9,0,0,TAU); d.fill();
    d.fillStyle = '#ffffff';
    d.beginPath(); d.arc(e[0]+2.8,e[1]-2,1.2,0,TAU); d.fill();
    if (blink > 0){
      d.fillStyle = C.main;
      d.beginPath(); d.ellipse(e[0],e[1]-6.4+blink*6.4,7.4,7.4*blink,0,0,TAU); d.fill();
      d.strokeStyle = C.ink; d.lineWidth = 1.5;
      d.beginPath(); d.arc(e[0],e[1],7.4,Math.PI,TAU); d.stroke();
    }
  });
  d.restore();
}

/* ==================== TAVŞAN ==================== */
function artRabbit(d, spin, boost, C){
  d.lineJoin = 'round'; d.lineCap = 'round'; d.lineWidth = 2; d.strokeStyle = C.ink;
  const ear    = Math.sin(spin*1.8)*0.22 - boost*0.48;
  const run    = Math.sin(spin*3.2);
  const twitch = Math.sin(spin*7)*0.5;
  const inner  = mix('#f7a8b8', C.light, 0.3);

  d.save();
  d.scale(1 + boost*0.04, 1 - boost*0.05);

  [[-4,-0.30,C.dark,0.8],[1,0.06,C.main,1]].forEach(k => {
    d.save(); d.translate(9+k[0], -10.5); d.rotate(k[1] + ear);
    d.fillStyle = k[2];
    d.beginPath(); d.moveTo(0,2);
    d.quadraticCurveTo(-5,-7,-3,-19);  d.quadraticCurveTo(-1,-26,1.6,-24);
    d.quadraticCurveTo(5.4,-17,4.2,-5); d.quadraticCurveTo(3.2,-0.5,0,2);
    d.closePath(); d.fill(); d.stroke();
    d.globalAlpha = k[3]; d.fillStyle = inner;
    d.beginPath(); d.ellipse(0.4,-12.5,2,9,0.05,0,TAU); d.fill();
    d.globalAlpha = 1; d.restore();
  });

  d.fillStyle = C.pale;
  [[-19,4,5.5],[-16,0,4],[-16,7.5,4]].forEach(t => { d.beginPath(); d.arc(t[0],t[1],t[2],0,TAU); d.fill(); });
  d.strokeStyle = C.ink; d.beginPath(); d.arc(-19,4,5.5,0,TAU); d.stroke();

  d.fillStyle = C.dark;
  d.save(); d.translate(-7,9); d.rotate(run*0.2);
  d.beginPath(); d.ellipse(0,0,8.5,5.4,-0.1,0,TAU); d.fill(); d.stroke();
  d.restore();

  d.beginPath(); d.ellipse(-2,3,14.5,11,0.05,0,TAU);
  const bg = d.createLinearGradient(0,-8,0,15);
  bg.addColorStop(0,mix(C.light,'#ffffff',0.4)); bg.addColorStop(.6,C.main); bg.addColorStop(1,C.dark);
  d.fillStyle = bg; d.fill(); d.stroke();
  d.save(); d.beginPath(); d.ellipse(-2,3,14.5,11,0.05,0,TAU); d.clip();
  d.fillStyle = mix(C.pale,'#ffffff',0.5);
  [[3,10,7],[-4,11,6],[-10,9,5]].forEach(f => { d.beginPath(); d.arc(f[0],f[1],f[2],0,TAU); d.fill(); });
  d.fillStyle = 'rgba(255,255,255,.32)';
  d.beginPath(); d.ellipse(-3,-5,10,3,-0.06,0,TAU); d.fill();
  d.restore();

  d.fillStyle = C.dark;
  d.save(); d.translate(7,12); d.rotate(run*0.5);
  d.beginPath(); d.ellipse(0,0,5.5,3,0,0,TAU); d.fill(); d.stroke();
  d.strokeStyle = C.ink; d.lineWidth = 1.2;
  for (let k=-1;k<2;k++){ d.beginPath(); d.moveTo(3.6,0); d.lineTo(6.4,k*1.8); d.stroke(); }
  d.restore(); d.lineWidth = 2;

  d.beginPath(); d.ellipse(12,-3,9.6,8.6,-0.08,0,TAU);
  const hg = d.createLinearGradient(12,-11,12,6);
  hg.addColorStop(0,mix(C.light,'#ffffff',0.45)); hg.addColorStop(1,C.main);
  d.fillStyle = hg; d.strokeStyle = C.ink; d.fill(); d.stroke();
  d.save(); d.beginPath(); d.ellipse(12,-3,9.6,8.6,-0.08,0,TAU); d.clip();
  d.fillStyle = mix(C.pale,'#ffffff',0.6);
  d.beginPath(); d.ellipse(16.5,1.5,7,5,0,0,TAU); d.fill();
  d.restore();

  d.fillStyle = '#241a12';
  d.beginPath(); d.ellipse(13.6,-5,2.6,3.1,0,0,TAU); d.fill();
  d.fillStyle = '#fff'; d.beginPath(); d.arc(14.5,-6.1,1.05,0,TAU); d.fill();

  d.save(); d.translate(20.2,-0.4); d.rotate(twitch*0.1);
  d.fillStyle = '#f7788f'; d.strokeStyle = C.ink; d.lineWidth = 1.5;
  d.beginPath(); d.moveTo(-1.6,-2.3); d.lineTo(2.6,0); d.lineTo(-1.6,2.3); d.closePath(); d.fill(); d.stroke();
  d.beginPath(); d.moveTo(-0.4,2.3); d.lineTo(-0.4,3.9); d.stroke();
  d.strokeStyle = 'rgba(40,30,20,.42)'; d.lineWidth = 1;
  [-1,1].forEach(sy => { for (let k=0;k<2;k++){
    d.beginPath(); d.moveTo(0.6,0.6*sy); d.quadraticCurveTo(4,sy*(1.6+k*2), 7.6,sy*(3+k*2.6)); d.stroke(); } });
  d.fillStyle = '#fffdf5'; d.strokeStyle = C.ink; d.lineWidth = 1.1;
  d.beginPath(); d.roundRect(-1.9,3.7,3.6,3.2,1); d.fill(); d.stroke();
  d.restore();
  d.restore();
}

/* ==================== MİNİK EJDERHA ==================== */
function artDragon(d, spin, boost, C){
  d.lineJoin = 'round'; d.lineCap = 'round'; d.lineWidth = 2; d.strokeStyle = C.ink;
  const flapAngle = Math.sin(spin * 3.8) * 0.65 - boost * 0.75;
  const tailSway = Math.sin(spin * 2.5) * 3;

  // Uzun ejder kuyruğu ve alevi
  d.fillStyle = C.dark;
  d.beginPath();
  d.moveTo(-10, 4);
  d.quadraticCurveTo(-16, 2, -20, -3 + tailSway);
  d.quadraticCurveTo(-15, 7, -8, 8);
  d.closePath(); d.fill(); d.stroke();
  d.fillStyle = '#ff5722';
  d.beginPath();
  d.arc(-20, -3 + tailSway, 2.8 + Math.sin(spin * 8) * 0.8, 0, TAU);
  d.fill();

  // Gövde
  d.beginPath();
  d.ellipse(0, 1, 15, 12, -0.05, 0, TAU);
  const bg = d.createLinearGradient(0, -12, 0, 13);
  bg.addColorStop(0, mix(C.light, '#ffaa00', 0.3));
  bg.addColorStop(0.5, C.main);
  bg.addColorStop(1, C.deep);
  d.fillStyle = bg; d.fill(); d.stroke();

  // Sarımsı karın zırh plakaları
  d.save(); d.beginPath(); d.ellipse(0, 1, 15, 12, -0.05, 0, TAU); d.clip();
  d.fillStyle = mix(C.pale, '#ffe066', 0.5);
  d.beginPath(); d.ellipse(4, 7, 11, 6.5, 0.1, 0, TAU); d.fill();
  d.strokeStyle = 'rgba(180,90,0,0.35)'; d.lineWidth = 1.3;
  for (let py = 3; py < 12; py += 3){
    d.beginPath(); d.moveTo(-2, py); d.lineTo(10, py); d.stroke();
  }
  d.restore();

  // Sırt dikenleri
  d.fillStyle = '#ffd166'; d.strokeStyle = C.ink; d.lineWidth = 1.5;
  [[-8, -8], [-3, -11], [2, -12]].forEach(pt => {
    d.beginPath();
    d.moveTo(pt[0] - 2, pt[1] + 2);
    d.lineTo(pt[0], pt[1] - 4);
    d.lineTo(pt[0] + 2, pt[1] + 2);
    d.closePath(); d.fill(); d.stroke();
  });

  // Boynuz
  d.fillStyle = '#ffe6a7'; d.strokeStyle = C.ink; d.lineWidth = 1.8;
  d.beginPath();
  d.moveTo(1, -9);
  d.quadraticCurveTo(0, -18, -6, -20);
  d.quadraticCurveTo(-3, -14, 5, -8);
  d.closePath(); d.fill(); d.stroke();

  // Ejderha gözü
  const eyeX = 8, eyeY = -3;
  d.fillStyle = '#fff3b0'; d.strokeStyle = C.ink; d.lineWidth = 1.8;
  d.beginPath(); d.arc(eyeX, eyeY, 5.2, 0, TAU); d.fill(); d.stroke();
  d.fillStyle = '#780000';
  d.beginPath(); d.ellipse(eyeX + 1.2, eyeY, 1.4, 3.8, 0.1, 0, TAU); d.fill();
  d.fillStyle = '#ffffff';
  d.beginPath(); d.arc(eyeX + 2, eyeY - 1.2, 1, 0, TAU); d.fill();

  // Burun dumanı
  d.fillStyle = C.ink;
  d.beginPath(); d.arc(16, 0, 1.2, 0, TAU); d.fill();
  if (boost > 0 || Math.sin(spin * 4) > 0.4){
    d.fillStyle = 'rgba(255,100,20,0.7)';
    d.beginPath(); d.arc(19 + Math.sin(spin * 6) * 2, -1, 2.4, 0, TAU); d.fill();
  }

  // YARASA TİPİ EJDERHA KANADI
  d.save();
  d.translate(-2, 0);
  d.rotate(flapAngle);
  d.fillStyle = C.deep; d.strokeStyle = C.ink; d.lineWidth = 2;
  d.beginPath();
  d.moveTo(3, -2);
  d.lineTo(-2, -16);
  d.lineTo(-12, -14);
  d.quadraticCurveTo(-8, -6, -14, -2);
  d.quadraticCurveTo(-7, 2, -11, 8);
  d.quadraticCurveTo(-3, 4, 3, 0);
  d.closePath();
  const wg = d.createLinearGradient(0, -16, 0, 8);
  wg.addColorStop(0, mix(C.light, '#ff5400', 0.3));
  wg.addColorStop(1, C.deep);
  d.fillStyle = wg; d.fill(); d.stroke();
  d.strokeStyle = C.ink; d.lineWidth = 1.4;
  d.beginPath(); d.moveTo(3, -2); d.lineTo(-12, -14); d.stroke();
  d.beginPath(); d.moveTo(3, -2); d.lineTo(-14, -2); d.stroke();
  d.beginPath(); d.moveTo(3, -2); d.lineTo(-11, 8); d.stroke();
  d.restore();
}

/* ==================== UÇAN SPOR ARABA ==================== */
function artCar(d, spin, boost, C){
  d.lineJoin = 'round'; d.lineCap = 'round'; d.lineWidth = 2; d.strokeStyle = C.ink;
  const wheel = spin * 2.8;

  // Çift turbo nitro alevi & egzoz
  if (boost > 0){
    const fl = boost * (14 + Math.sin(spin * 16) * 4);
    d.fillStyle = '#ff7b00';
    d.beginPath(); d.moveTo(-21, 4.5); d.lineTo(-21 - fl, 6); d.lineTo(-21, 7.5); d.closePath(); d.fill();
    d.fillStyle = '#00f5d4';
    d.beginPath(); d.moveTo(-21, 5.2); d.lineTo(-21 - fl*0.65, 6); d.lineTo(-21, 6.8); d.closePath(); d.fill();
    for (let i = 0; i < 3; i++){
      d.globalAlpha = boost * 0.45 * (1 - i/3.6); d.fillStyle = '#c9ced4';
      d.beginPath(); d.arc(-23 - i*9, 7 + Math.sin(spin*2 + i)*2, 5 - i, 0, TAU); d.fill();
    }
    d.globalAlpha = 1;
  }

  function tyre(x, r){
    d.save(); d.translate(x, 8);
    d.fillStyle = '#22262a';
    d.beginPath(); d.arc(0, 0, r, 0, TAU); d.fill();
    d.save(); d.rotate(wheel);
    const jg = d.createLinearGradient(-r, -r, r, r);
    jg.addColorStop(0, '#f2f5f7'); jg.addColorStop(1, '#9aa4ad');
    d.fillStyle = jg; d.beginPath(); d.arc(0, 0, r*0.55, 0, TAU); d.fill();
    d.strokeStyle = '#7d868e'; d.lineWidth = 1.4;
    for (let a = 0; a < 5; a++){
      const t = a * 1.2566;
      d.beginPath(); d.moveTo(0, 0); d.lineTo(Math.cos(t)*r*0.5, Math.sin(t)*r*0.5); d.stroke();
    }
    d.fillStyle = '#5c656d'; d.beginPath(); d.arc(0, 0, 1.6, 0, TAU); d.fill();
    d.restore();
    d.strokeStyle = C.ink; d.lineWidth = 2;
    d.beginPath(); d.arc(0, 0, r, 0, TAU); d.stroke();
    d.restore();
  }
  tyre(-10, 6.6); tyre(11, 6.6);

  d.beginPath();
  d.moveTo(-20, 7);
  d.lineTo(-20, -1); d.quadraticCurveTo(-19, -3, -14, -3.6);
  d.lineTo(-8, -11.5); d.quadraticCurveTo(-6, -13.5, -1, -13.6);
  d.lineTo(7, -13.6); d.quadraticCurveTo(11, -13.4, 13, -9.5);
  d.lineTo(16, -4); d.quadraticCurveTo(21, -3, 21, 2);
  d.lineTo(21, 7); d.closePath();
  const bg = d.createLinearGradient(0, -14, 0, 8);
  bg.addColorStop(0, mix(C.light, '#ffffff', 0.45));
  bg.addColorStop(0.34, C.main);
  bg.addColorStop(0.8, C.dark);
  bg.addColorStop(1, C.deep);
  d.fillStyle = bg; d.fill();

  d.save(); d.clip();
  d.fillStyle = 'rgba(255,255,255,.5)';
  d.beginPath(); d.moveTo(-20, -1.4); d.lineTo(21, -3.4); d.lineTo(21, -1.4); d.lineTo(-20, 0.6); d.closePath(); d.fill();
  d.strokeStyle = 'rgba(0,0,0,.28)'; d.lineWidth = 1.4;
  d.beginPath(); d.moveTo(1, -12); d.lineTo(1.5, 7); d.stroke();
  d.fillStyle = 'rgba(0,0,0,.3)'; d.beginPath(); d.roundRect(-4, -2.6, 4, 1.6, 0.8); d.fill();
  d.restore();
  d.strokeStyle = C.ink; d.lineWidth = 2;
  d.beginPath();
  d.moveTo(-20, 7);
  d.lineTo(-20, -1); d.quadraticCurveTo(-19, -3, -14, -3.6);
  d.lineTo(-8, -11.5); d.quadraticCurveTo(-6, -13.5, -1, -13.6);
  d.lineTo(7, -13.6); d.quadraticCurveTo(11, -13.4, 13, -9.5);
  d.lineTo(16, -4); d.quadraticCurveTo(21, -3, 21, 2);
  d.lineTo(21, 7); d.closePath(); d.stroke();

  const win = d.createLinearGradient(0, -12, 0, -4);
  win.addColorStop(0, '#cfeef2'); win.addColorStop(1, '#7fb8c4');
  d.fillStyle = win; d.lineWidth = 1.8;
  d.beginPath(); d.moveTo(-5.5, -4.6); d.lineTo(-0.6, -11.4); d.lineTo(0.4, -11.4);
  d.lineTo(0.4, -4.6); d.closePath(); d.fill(); d.stroke();
  d.beginPath(); d.moveTo(2.6, -4.6); d.lineTo(2.6, -11.4); d.lineTo(7, -11.4);
  d.lineTo(11.6, -4.6); d.closePath(); d.fill(); d.stroke();
  d.fillStyle = 'rgba(255,255,255,.55)';
  d.beginPath(); d.moveTo(3.4, -10.6); d.lineTo(6.4, -10.6); d.lineTo(2.9, -5.4); d.closePath(); d.fill();

  d.fillStyle = C.deep; d.lineWidth = 1.6;
  [-10, 11].forEach(wx => {
    d.beginPath(); d.arc(wx, 8, 8.6, Math.PI, TAU); d.closePath();
    d.globalAlpha = 0.35; d.fill(); d.globalAlpha = 1;
    d.strokeStyle = C.ink; d.beginPath(); d.arc(wx, 8, 8.6, Math.PI, TAU); d.stroke();
  });

  // Ön far ve ışık konisi
  d.fillStyle = '#fff2a8'; d.strokeStyle = C.ink; d.lineWidth = 1.6;
  d.beginPath(); d.ellipse(19.6, -0.4, 2.6, 3, 0, 0, TAU); d.fill(); d.stroke();
  d.globalAlpha = 0.45; d.fillStyle = '#fff6c0';
  d.beginPath(); d.moveTo(21, -2.6); d.lineTo(32, -2); d.lineTo(21, 2.2); d.closePath(); d.fill();
  d.globalAlpha = 1;

  // Stop lambası ve spoyler
  d.fillStyle = '#e63946';
  d.beginPath(); d.roundRect(-20.5, -1.2, 3, 3.4, 1); d.fill(); d.stroke();
  d.fillStyle = '#b9c2ca';
  d.beginPath(); d.roundRect(-21.5, 4, 5, 3, 1.4); d.fill(); d.stroke();
  d.beginPath(); d.roundRect(17.5, 3.6, 5, 3, 1.4); d.fill(); d.stroke();
  d.fillStyle = C.dark;
  d.beginPath(); d.roundRect(9.5, -13, 4.5, 2.4, 1); d.fill(); d.stroke();
  d.beginPath(); d.moveTo(-20, -1); d.lineTo(-24, -4.6); d.lineTo(-20, -4.6); d.closePath(); d.fill(); d.stroke();
}

/* ==================== UFO (KOZMİK GEZGİN) ==================== */
function artUfo(d, spin, boost, C){
  d.lineJoin = 'round'; d.lineCap = 'round'; d.lineWidth = 2; d.strokeStyle = C.ink;
  const hover = Math.sin(spin * 2.8) * 1.2;

  // İtiş halkası (antigravity pulse)
  if (boost > 0){
    const beamR = 12 + boost * 16;
    d.save();
    d.globalAlpha = boost * 0.75;
    d.strokeStyle = '#00f5d4'; d.lineWidth = 2.5;
    d.beginPath(); d.ellipse(0, 9 + boost*4, beamR, beamR*0.35, 0, 0, TAU); d.stroke();
    d.fillStyle = 'rgba(0,245,212,0.2)';
    d.beginPath();
    d.moveTo(-10, 6); d.lineTo(-beamR, 9 + boost*4);
    d.lineTo(beamR, 9 + boost*4); d.lineTo(10, 6);
    d.closePath(); d.fill();
    d.restore();
  }

  // UFO altı emitör
  d.fillStyle = '#0f172a'; d.strokeStyle = C.ink; d.lineWidth = 2;
  d.beginPath(); d.ellipse(0, 6, 8, 3.5, 0, 0, TAU); d.fill(); d.stroke();
  d.fillStyle = '#00f5d4';
  d.beginPath(); d.ellipse(0, 6.2, 5, 2, 0, 0, TAU); d.fill();

  // Şeffaf cam kubbe içindeki uzaylı
  d.save();
  d.translate(0, -3 + hover*0.5);
  // Uzaylı antenleri
  const antSway = Math.sin(spin * 4) * 0.2;
  [-3.5, 3.5].forEach(ax => {
    d.strokeStyle = '#10b981'; d.lineWidth = 1.6;
    d.beginPath(); d.moveTo(ax, -6); d.quadraticCurveTo(ax*1.5 + antSway*5, -12, ax*1.8 + antSway*6, -14); d.stroke();
    d.fillStyle = '#fef08a';
    d.beginPath(); d.arc(ax*1.8 + antSway*6, -14, 1.8, 0, TAU); d.fill();
  });
  // Uzaylı kafası
  d.fillStyle = '#34d399'; d.strokeStyle = C.ink; d.lineWidth = 1.6;
  d.beginPath(); d.ellipse(0, -4, 6.2, 5.5, 0, 0, TAU); d.fill(); d.stroke();
  // Uzaylı gözleri
  [-2.2, 2.2].forEach(ex => {
    d.fillStyle = '#064e3b';
    d.beginPath(); d.ellipse(ex, -4, 1.8, 2.6, ex > 0 ? 0.2 : -0.2, 0, TAU); d.fill();
    d.fillStyle = '#ffffff';
    d.beginPath(); d.arc(ex + 0.6, -5, 0.8, 0, TAU); d.fill();
  });
  d.restore();

  // Şeffaf cam fanus kubbe (Dome)
  d.beginPath();
  d.ellipse(0, -3, 11, 10, 0, Math.PI, TAU);
  d.closePath();
  const domeG = d.createLinearGradient(0, -13, 0, -3);
  domeG.addColorStop(0, 'rgba(255,255,255,0.7)');
  domeG.addColorStop(0.3, 'rgba(120,230,250,0.45)');
  domeG.addColorStop(1, 'rgba(20,120,180,0.3)');
  d.fillStyle = domeG; d.fill();
  d.strokeStyle = 'rgba(255,255,255,0.85)'; d.lineWidth = 1.5;
  d.beginPath(); d.arc(-3, -7, 4.5, -Math.PI*0.7, -Math.PI*0.1); d.stroke();
  d.strokeStyle = C.ink; d.lineWidth = 2;
  d.beginPath(); d.ellipse(0, -3, 11, 10, 0, Math.PI, TAU); d.stroke();

  // Metalik daire saucer gövde
  d.beginPath();
  d.ellipse(0, 1, 23, 7.5, 0, 0, TAU);
  const saucerG = d.createLinearGradient(0, -6, 0, 8);
  saucerG.addColorStop(0, mix(C.light, '#ffffff', 0.4));
  saucerG.addColorStop(0.45, C.main);
  saucerG.addColorStop(1, C.deep);
  d.fillStyle = saucerG; d.fill(); d.stroke();

  // Dönen neon LED ışıklar
  const ledCols = ['#f72585', '#4cc9f0', '#7209b7', '#f72585', '#4cc9f0', '#ffbe0b'];
  const numLeds = 6;
  for (let i = 0; i < numLeds; i++){
    const ang = spin * 3 + (i / numLeds) * TAU;
    const lx = Math.cos(ang) * 19;
    const ly = 1 + Math.sin(ang) * 5;
    if (Math.sin(ang) > -0.2){
      const col = ledCols[i % ledCols.length];
      d.fillStyle = col;
      d.beginPath(); d.arc(lx, ly, 1.8, 0, TAU); d.fill();
      d.fillStyle = 'rgba(255,255,255,0.6)';
      d.beginPath(); d.arc(lx, ly, 0.7, 0, TAU); d.fill();
    }
  }
}

/* ==================== ALTIN MEKİK (30 SKOR EFSANEVİ) ====================
   Parayla satılmaz, tek turda 30 skora ulaşarak hak edilir.
   24 Ayar saf ayna altın gövde, prizmatik elmas kokpit, iyon-plazma şok elmasları
   ve havada süzülen kozmik altın ışıltılar. */
function artShuttle(d, spin, boost, C){
  d.lineJoin = 'round'; d.lineCap = 'round';
  const pulse = 0.5 + 0.5*Math.sin(spin*3.2);
  const fl    = 0.42 + boost*0.58;
  const jit   = 1 + Math.sin(spin*13)*0.08 + Math.sin(spin*7.1)*0.05;

  // 1. Dış Kozmik Altın Hale (Güneş Diski)
  const halo = d.createRadialGradient(0, 0, 8, 0, 0, 42);
  halo.addColorStop(0,   'rgba(255, 235, 140, ' + (0.28 + boost*0.35 + pulse*0.08).toFixed(3) + ')');
  halo.addColorStop(0.5, 'rgba(255, 190, 40, ' + (0.14 + boost*0.18).toFixed(3) + ')');
  halo.addColorStop(1,   'rgba(255, 150, 0, 0)');
  d.fillStyle = halo;
  d.beginPath(); d.arc(0, 0, 42, 0, TAU); d.fill();

  // 2. İyon-Füzyon Çift Egzoz Alevi & Plazma Şok Elmasları
  [-5.8, 3.8].forEach(py => {
    // Katmanlı plazma alevleri: Kırmızı/Kehribar -> Kor Altın -> Elektrik Siyan -> Akkor Beyaz
    const flames = [
      [36, 7.8, 'rgba(255, 75, 20, 0.48)'],
      [26, 5.8, 'rgba(255, 185, 30, 0.75)'],
      [17, 3.8, 'rgba(64, 224, 255, 0.90)'],
      [10, 2.2, 'rgba(255, 255, 255, 0.98)']
    ];
    flames.forEach(f => {
      const len = f[0]*fl*jit, r = f[1]*(0.85 + boost*0.3);
      d.fillStyle = f[2];
      d.beginPath();
      d.moveTo(-20, py - r);
      d.quadraticCurveTo(-20 - len*0.5, py - r*0.5, -20 - len, py);
      d.quadraticCurveTo(-20 - len*0.5, py + r*0.5, -20, py + r);
      d.closePath(); d.fill();
    });

    // Şok Elmasları (Supersonic Shock Diamonds)
    for (let si = 1; si <= 3; si++){
      const sx = -20 - si * (7 + boost*5) * fl;
      d.fillStyle = 'rgba(255, 255, 255, ' + (0.75 - si*0.18).toFixed(2) + ')';
      d.beginPath();
      d.moveTo(sx - 2, py);
      d.lineTo(sx, py - 2.2);
      d.lineTo(sx + 2, py);
      d.lineTo(sx, py + 2.2);
      d.closePath(); d.fill();
    }
  });

  // 3. Uzak Delta Kanat (Alt katman derinlik)
  d.fillStyle = '#9e6700';
  d.beginPath();
  d.moveTo(6, -2); d.lineTo(-13, -17); d.lineTo(-3, -18); d.lineTo(13, -3);
  d.closePath(); d.fill();
  d.strokeStyle = '#5a3800'; d.lineWidth = 1.5; d.stroke();

  // 4. Titanyum-Altın İtki Nozul Kovanları
  [-5.8, 3.8].forEach(py => {
    const ng = d.createLinearGradient(-23, py-3.5, -17, py+3.5);
    ng.addColorStop(0, '#5a3600'); ng.addColorStop(0.5, '#ffd24d'); ng.addColorStop(1, '#3b2200');
    d.fillStyle = ng; d.strokeStyle = '#321c00'; d.lineWidth = 1.8;
    d.beginPath(); d.roundRect(-23, py - 3.2, 8, 6.4, 2); d.fill(); d.stroke();

    // Nozul iç akkor plazma halkası
    d.fillStyle = '#55e6ff';
    d.beginPath(); d.ellipse(-23, py, 1.4, 2.6, 0, 0, TAU); d.fill();
  });

  // 5. Dikey Kuyruk ve Altın Şevron
  const fin = d.createLinearGradient(-18, -23, -2, -5);
  fin.addColorStop(0, '#fff4a3'); fin.addColorStop(0.4, '#e6a800'); fin.addColorStop(1, '#7a4600');
  d.fillStyle = fin; d.strokeStyle = '#3d2400'; d.lineWidth = 2;
  d.beginPath();
  d.moveTo(-5, -6); d.lineTo(-17, -23); d.quadraticCurveTo(-13, -24, -9.5, -21.5);
  d.lineTo(0, -6); d.closePath(); d.fill(); d.stroke();

  // Kuyruk üstü altın kaplama & şerit
  d.strokeStyle = '#fff8bd'; d.lineWidth = 1.5;
  d.beginPath(); d.moveTo(-15, -20); d.lineTo(-10.5, -18.5); d.stroke();
  d.fillStyle = '#00f0ff'; // Tepe uydu feneri
  d.beginPath(); d.arc(-16.5, -22, 1.8, 0, TAU); d.fill();

  // 6. Aerodinamik Gövde (24K Ayna Altın)
  d.beginPath();
  d.moveTo(27, 0);
  d.quadraticCurveTo(23, -8, 10, -10.5);
  d.lineTo(-13, -10.5);
  d.quadraticCurveTo(-20.5, -9.5, -20.5, -5);
  d.lineTo(-20.5, 6);
  d.quadraticCurveTo(-20.5, 10.5, -13, 11);
  d.lineTo(7, 11);
  d.quadraticCurveTo(22, 9, 27, 0);
  d.closePath();

  const bg = d.createLinearGradient(0, -11, 0, 12);
  bg.addColorStop(0,    '#ffffff');
  bg.addColorStop(0.18, '#ffe978');
  bg.addColorStop(0.42, '#f5af00');
  bg.addColorStop(0.72, '#b87500');
  bg.addColorStop(1,    '#5a3300');
  d.fillStyle = bg; d.fill();

  // Gövde içi ayna cilası & kraliyet panelleri
  d.save(); d.clip();
  // Dinamik kayan metalik ışıltı dalgası
  const sweep = ((spin * 36) % 90) - 40;
  const sg = d.createLinearGradient(sweep, -12, sweep + 24, 12);
  sg.addColorStop(0, 'rgba(255,255,255,0)');
  sg.addColorStop(0.5, 'rgba(255,255,255,0.72)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  d.fillStyle = sg; d.fillRect(-24, -12, 54, 25);

  // Üst altın vurgu çizgisi
  d.fillStyle = 'rgba(255, 255, 255, 0.85)';
  d.beginPath(); d.ellipse(4, -8.6, 18, 2.2, 0, 0, TAU); d.fill();

  // Kraliyet yakut kalkan şeridi (koyu bordo-altın geçiş)
  const rg = d.createLinearGradient(0, 1.5, 0, 5.5);
  rg.addColorStop(0, '#800010'); rg.addColorStop(0.5, '#bd1026'); rg.addColorStop(1, '#500008');
  d.fillStyle = rg; d.fillRect(-22, 1.8, 52, 3.8);
  d.fillStyle = '#fff085'; d.fillRect(-22, 0.8, 52, 1.1); // altın mikro tel

  // Fütüristik filigran gravür / ısı karoları
  d.fillStyle = 'rgba(74, 40, 0, 0.35)';
  for (let px = -8; px < 20; px += 5.5){
    d.fillRect(px, 7.2, 3.8, 2.8);
    d.strokeStyle = 'rgba(255, 240, 160, 0.4)'; d.lineWidth = 0.8;
    d.strokeRect(px, 7.2, 3.8, 2.8);
  }
  d.restore();
  d.strokeStyle = '#3d2400'; d.lineWidth = 2.2; d.stroke();

  // 7. Burun Isı Kalkanı (Obsidyen & Altın Şevron)
  d.beginPath();
  d.moveTo(27, 0); d.quadraticCurveTo(23, -8, 15, -9.8);
  d.lineTo(15, 10.5); d.quadraticCurveTo(22, 8.8, 27, 0);
  d.closePath();
  const ng2 = d.createLinearGradient(15, 0, 27, 0);
  ng2.addColorStop(0, '#1c1511'); ng2.addColorStop(0.65, '#2e231c'); ng2.addColorStop(1, '#0e0b08');
  d.fillStyle = ng2; d.fill(); d.stroke();
  // Burun ucu altın reflektör şeridi
  d.strokeStyle = '#ffd700'; d.lineWidth = 1.8;
  d.beginPath(); d.moveTo(15, -9.6); d.lineTo(15, 10.2); d.stroke();

  // 8. Ana Yakın Delta Kanat (Altın Plakalı)
  const wing = d.createLinearGradient(5, 2, -14, 22);
  wing.addColorStop(0,    '#ffffff');
  wing.addColorStop(0.24, '#ffe766');
  wing.addColorStop(0.62, '#e09800');
  wing.addColorStop(1,    '#703c00');
  d.fillStyle = wing;
  d.beginPath();
  d.moveTo(15, 3.2);
  d.quadraticCurveTo(3, 10.5, -17, 19.8);
  d.lineTo(-4, 21.5);
  d.quadraticCurveTo(14, 13.8, 20, 5.8);
  d.closePath(); d.fill();
  d.strokeStyle = '#3d2400'; d.lineWidth = 2; d.stroke();

  // Kanat üstü altın plaka fasetleri
  d.fillStyle = 'rgba(255, 255, 255, 0.45)';
  d.beginPath();
  d.moveTo(14, 3.5); d.lineTo(1, 9.8); d.lineTo(-7, 17.5); d.lineTo(-2, 17.5); d.lineTo(15, 6);
  d.closePath(); d.fill();

  // Kanat Ucu Plazma Kondansatörü & Seyir Feneri
  d.fillStyle = 'rgba(0, 240, 255, ' + (0.35 + pulse*0.5).toFixed(3) + ')';
  d.beginPath(); d.arc(-16.5, 19.5, 5.5, 0, TAU); d.fill();
  d.fillStyle = '#00f0ff';
  d.beginPath(); d.arc(-16.5, 19.5, 2.4, 0, TAU); d.fill();
  d.fillStyle = '#ffffff';
  d.beginPath(); d.arc(-16.5, 19.5, 1.1, 0, TAU); d.fill();

  // 9. Prizmatik Elmas Kokpit (Canopy)
  const cg = d.createLinearGradient(2, -10, 11, -2);
  cg.addColorStop(0,   '#ffffff');
  cg.addColorStop(0.2, '#ccfbff');
  cg.addColorStop(0.55,'#00d4ff');
  cg.addColorStop(0.85,'#0369a1');
  cg.addColorStop(1,   '#022c44');
  d.fillStyle = cg; d.lineWidth = 1.8; d.strokeStyle = '#1e293b';
  d.beginPath();
  d.moveTo(1.5, -8.6); d.lineTo(12.5, -8.0); d.lineTo(10.8, -2.2); d.lineTo(1.5, -2.6);
  d.closePath(); d.fill(); d.stroke();

  // Kokpit içindeki dönen kozmik enerji çekirdeği (Mini Pulsar)
  const coreX = 6.2, coreY = -5.4;
  d.fillStyle = 'rgba(255, 240, 140, ' + (0.5 + 0.5*Math.cos(spin*4)).toFixed(3) + ')';
  d.beginPath(); d.arc(coreX, coreY, 2.2, 0, TAU); d.fill();
  d.fillStyle = '#ffffff';
  d.beginPath(); d.arc(coreX, coreY, 1.1, 0, TAU); d.fill();

  // Elmas cam yansıması
  d.fillStyle = 'rgba(255, 255, 255, 0.85)';
  d.beginPath();
  d.moveTo(2.4, -7.8); d.lineTo(5.8, -7.7); d.lineTo(4.2, -3.2); d.lineTo(2.2, -3.3);
  d.closePath(); d.fill();

  // 10. Dönen Altın Pırlanta Parıltıları (Dazzle Sparkles)
  const glints = [
    [23, -6.5, 1.15],
    [-5, -16.5, 1.0],
    [12, 13.5, 0.95],
    [-16, 9.5, 0.85],
    [3, -12.5, 0.75],
    [19, 7.5, 0.70]
  ];
  glints.forEach((s, i) => {
    const k = 0.5 + 0.5*Math.sin(spin*4.2 + i*1.7);
    if (k < 0.15) return;
    const r = s[2]*(2.8 + k*4.2);
    d.save();
    d.translate(s[0], s[1]);
    d.rotate(spin*0.8 + i*1.1);
    d.globalAlpha = k;

    // 8 Uçlu Altın Yıldız Parıltısı
    d.fillStyle = '#fffdf0';
    d.beginPath();
    d.moveTo(0, -r);
    d.quadraticCurveTo(0.5, -0.5, r, 0);
    d.quadraticCurveTo(0.5, 0.5, 0, r);
    d.quadraticCurveTo(-0.5, 0.5, -r, 0);
    d.quadraticCurveTo(-0.5, -0.5, 0, -r);
    d.closePath(); d.fill();

    // İç parlak beyaz çekirdek
    d.fillStyle = '#ffffff';
    d.beginPath(); d.arc(0, 0, r*0.28, 0, TAU); d.fill();
    d.restore();
  });
}

/* ==================== ELMAS MEKİK (40 SKOR MİTOLOJİK) ====================
   Parayla satılmaz, tek turda 40 skora ulaşarak hak edilir.
   Kuantum saf elmas ve prizmatik kristal gövde, plazma-iyon çift motoru,
   süperiletken çekirdek ve dönen prizmatik elmas parıltıları. */
function artDiamondShuttle(d, spin, boost, C){
  d.lineJoin = 'round'; d.lineCap = 'round';
  const pulse = 0.5 + 0.5*Math.sin(spin*3.6);
  const fl    = 0.45 + boost*0.55;
  const jit   = 1 + Math.sin(spin*14)*0.08 + Math.sin(spin*8.3)*0.05;

  // 1. Dış Kuantum-Elmas Hale (Aura)
  const halo = d.createRadialGradient(0, 0, 8, 0, 0, 44);
  halo.addColorStop(0,   'rgba(224, 247, 250, ' + (0.32 + boost*0.35 + pulse*0.1).toFixed(3) + ')');
  halo.addColorStop(0.45,'rgba(56, 189, 248, ' + (0.18 + boost*0.2).toFixed(3) + ')');
  halo.addColorStop(0.8, 'rgba(147, 51, 234, ' + (0.08 + boost*0.1).toFixed(3) + ')');
  halo.addColorStop(1,   'rgba(0, 229, 255, 0)');
  d.fillStyle = halo;
  d.beginPath(); d.arc(0, 0, 44, 0, TAU); d.fill();

  // 2. Kuantum Plazma Egzoz Alevi & Kristal Şok Elmasları
  [-5.8, 3.8].forEach(py => {
    const flames = [
      [38, 8.2, 'rgba(124, 58, 237, 0.52)'],
      [28, 6.2, 'rgba(0, 229, 255, 0.78)'],
      [18, 4.0, 'rgba(186, 230, 253, 0.92)'],
      [11, 2.4, 'rgba(255, 255, 255, 0.99)']
    ];
    flames.forEach(f => {
      const len = f[0]*fl*jit, r = f[1]*(0.85 + boost*0.3);
      d.fillStyle = f[2];
      d.beginPath();
      d.moveTo(-20, py - r);
      d.quadraticCurveTo(-20 - len*0.5, py - r*0.5, -20 - len, py);
      d.quadraticCurveTo(-20 - len*0.5, py + r*0.5, -20, py + r);
      d.closePath(); d.fill();
    });

    // Kuantum Şok Elmasları
    for (let si = 1; si <= 4; si++){
      const sx = -20 - si * (6.5 + boost*5) * fl;
      d.fillStyle = 'rgba(255, 255, 255, ' + (0.85 - si*0.16).toFixed(2) + ')';
      d.beginPath();
      d.moveTo(sx - 2.2, py);
      d.lineTo(sx, py - 2.4);
      d.lineTo(sx + 2.2, py);
      d.lineTo(sx, py + 2.4);
      d.closePath(); d.fill();
    }
  });

  // 3. Uzak Delta Kanat (Derin Safir / Elmas Tabanı)
  d.fillStyle = '#0369a1';
  d.beginPath();
  d.moveTo(6, -2); d.lineTo(-13, -17); d.lineTo(-3, -18); d.lineTo(13, -3);
  d.closePath(); d.fill();
  d.strokeStyle = '#0c4a6e'; d.lineWidth = 1.5; d.stroke();

  // 4. Kriyojenik İtki Nozul Kovanları
  [-5.8, 3.8].forEach(py => {
    const ng = d.createLinearGradient(-23, py-3.5, -17, py+3.5);
    ng.addColorStop(0, '#0c4a6e'); ng.addColorStop(0.5, '#bae6fd'); ng.addColorStop(1, '#0369a1');
    d.fillStyle = ng; d.strokeStyle = '#082f49'; d.lineWidth = 1.8;
    d.beginPath(); d.roundRect(-23, py - 3.2, 8, 6.4, 2); d.fill(); d.stroke();

    // Nozul iç akkor elmas plazma halkası
    d.fillStyle = '#ffffff';
    d.beginPath(); d.ellipse(-23, py, 1.4, 2.6, 0, 0, TAU); d.fill();
  });

  // 5. Dikey Kuyruk ve Elmas Şevron
  const fin = d.createLinearGradient(-18, -23, -2, -5);
  fin.addColorStop(0, '#ffffff'); fin.addColorStop(0.35, '#7dd3fc'); fin.addColorStop(0.7, '#0284c7'); fin.addColorStop(1, '#0c4a6e');
  d.fillStyle = fin; d.strokeStyle = '#082f49'; d.lineWidth = 2;
  d.beginPath();
  d.moveTo(-5, -6); d.lineTo(-17, -23); d.quadraticCurveTo(-13, -24, -9.5, -21.5);
  d.lineTo(0, -6); d.closePath(); d.fill(); d.stroke();

  // Kuyruk üstü elmas kristal kenar şeridi
  d.strokeStyle = '#e0f7fa'; d.lineWidth = 1.6;
  d.beginPath(); d.moveTo(-15, -20); d.lineTo(-10.5, -18.5); d.stroke();
  d.fillStyle = '#00f5ff';
  d.beginPath(); d.arc(-16.5, -22, 2.0, 0, TAU); d.fill();
  d.fillStyle = '#ffffff';
  d.beginPath(); d.arc(-16.5, -22, 1.0, 0, TAU); d.fill();

  // 6. Aerodinamik Gövde (Saf Prizmatik Elmas)
  d.beginPath();
  d.moveTo(27, 0);
  d.quadraticCurveTo(23, -8, 10, -10.5);
  d.lineTo(-13, -10.5);
  d.quadraticCurveTo(-20.5, -9.5, -20.5, -5);
  d.lineTo(-20.5, 6);
  d.quadraticCurveTo(-20.5, 10.5, -13, 11);
  d.lineTo(7, 11);
  d.quadraticCurveTo(22, 9, 27, 0);
  d.closePath();

  const bg = d.createLinearGradient(0, -11, 0, 12);
  bg.addColorStop(0,    '#ffffff');
  bg.addColorStop(0.18, '#e0f2fe');
  bg.addColorStop(0.42, '#7dd3fc');
  bg.addColorStop(0.72, '#0284c7');
  bg.addColorStop(1,    '#0c4a6e');
  d.fillStyle = bg; d.fill();

  // Gövde içi ayna elmas cilası & prizmatik dalga
  d.save(); d.clip();
  const sweep = ((spin * 40) % 94) - 42;
  const sg = d.createLinearGradient(sweep, -12, sweep + 24, 12);
  sg.addColorStop(0, 'rgba(255,255,255,0)');
  sg.addColorStop(0.35, 'rgba(186,230,253,0.5)');
  sg.addColorStop(0.5, 'rgba(255,255,255,0.92)');
  sg.addColorStop(0.65, 'rgba(232,121,249,0.5)');
  sg.addColorStop(1, 'rgba(255,255,255,0)');
  d.fillStyle = sg; d.fillRect(-24, -12, 54, 25);

  // Üst saf kristal yansıması
  d.fillStyle = 'rgba(255, 255, 255, 0.9)';
  d.beginPath(); d.ellipse(4, -8.6, 18, 2.2, 0, 0, TAU); d.fill();

  // Kuantum elmas kalkan şeridi (neon camgöbeği & eflatun)
  const rg = d.createLinearGradient(0, 1.5, 0, 5.5);
  rg.addColorStop(0, '#00b4d8'); rg.addColorStop(0.5, '#c084fc'); rg.addColorStop(1, '#0077b6');
  d.fillStyle = rg; d.fillRect(-22, 1.8, 52, 3.8);
  d.fillStyle = '#ffffff'; d.fillRect(-22, 0.8, 52, 1.1);

  // Elmas faset gravürü
  d.strokeStyle = 'rgba(255, 255, 255, 0.6)'; d.lineWidth = 0.9;
  for (let px = -8; px < 20; px += 6.5){
    d.beginPath();
    d.moveTo(px, 10.5); d.lineTo(px + 3, 7.2); d.lineTo(px + 6, 10.5);
    d.stroke();
  }
  d.restore();
  d.strokeStyle = '#082f49'; d.lineWidth = 2.2; d.stroke();

  // 7. Burun Isı Kalkanı
  d.beginPath();
  d.moveTo(27, 0); d.quadraticCurveTo(23, -8, 15, -9.8);
  d.lineTo(15, 10.5); d.quadraticCurveTo(22, 8.8, 27, 0);
  d.closePath();
  const ng2 = d.createLinearGradient(15, 0, 27, 0);
  ng2.addColorStop(0, '#0f172a'); ng2.addColorStop(0.6, '#0284c7'); ng2.addColorStop(1, '#e0f2fe');
  d.fillStyle = ng2; d.fill(); d.stroke();
  d.strokeStyle = '#38bdf8'; d.lineWidth = 1.8;
  d.beginPath(); d.moveTo(15, -9.6); d.lineTo(15, 10.2); d.stroke();

  // 8. Ana Yakın Delta Kanat
  const wing = d.createLinearGradient(5, 2, -14, 22);
  wing.addColorStop(0,    '#ffffff');
  wing.addColorStop(0.25, '#bae6fd');
  wing.addColorStop(0.65, '#0284c7');
  wing.addColorStop(1,    '#0c4a6e');
  d.fillStyle = wing;
  d.beginPath();
  d.moveTo(15, 3.2);
  d.quadraticCurveTo(3, 10.5, -17, 19.8);
  d.lineTo(-4, 21.5);
  d.quadraticCurveTo(14, 13.8, 20, 5.8);
  d.closePath(); d.fill();
  d.strokeStyle = '#082f49'; d.lineWidth = 2; d.stroke();

  // Kanat kristal faset çizgileri
  d.fillStyle = 'rgba(255, 255, 255, 0.6)';
  d.beginPath();
  d.moveTo(14, 3.5); d.lineTo(1, 9.8); d.lineTo(-7, 17.5); d.lineTo(-2, 17.5); d.lineTo(15, 6);
  d.closePath(); d.fill();

  // Kanat Ucu Kuantum Plazma Kondansatörü
  d.fillStyle = 'rgba(0, 240, 255, ' + (0.4 + pulse*0.5).toFixed(3) + ')';
  d.beginPath(); d.arc(-16.5, 19.5, 5.8, 0, TAU); d.fill();
  d.fillStyle = '#00f5ff';
  d.beginPath(); d.arc(-16.5, 19.5, 2.6, 0, TAU); d.fill();
  d.fillStyle = '#ffffff';
  d.beginPath(); d.arc(-16.5, 19.5, 1.2, 0, TAU); d.fill();

  // 9. Prizmatik Süperiletken Kokpit (Canopy)
  const cg = d.createLinearGradient(2, -10, 11, -2);
  cg.addColorStop(0,   '#ffffff');
  cg.addColorStop(0.2, '#c084fc');
  cg.addColorStop(0.6, '#38bdf8');
  cg.addColorStop(1,   '#022c44');
  d.fillStyle = cg; d.lineWidth = 1.8; d.strokeStyle = '#082f49';
  d.beginPath();
  d.moveTo(1.5, -8.6); d.lineTo(12.5, -8.0); d.lineTo(10.8, -2.2); d.lineTo(1.5, -2.6);
  d.closePath(); d.fill(); d.stroke();

  // Kokpit içi kuantum çekirdeği
  const coreX = 6.2, coreY = -5.4;
  d.fillStyle = 'rgba(192, 132, 252, ' + (0.5 + 0.5*Math.cos(spin*4)).toFixed(3) + ')';
  d.beginPath(); d.arc(coreX, coreY, 2.4, 0, TAU); d.fill();
  d.fillStyle = '#ffffff';
  d.beginPath(); d.arc(coreX, coreY, 1.2, 0, TAU); d.fill();

  // Kokpit cam yansıması
  d.fillStyle = 'rgba(255, 255, 255, 0.9)';
  d.beginPath();
  d.moveTo(2.4, -7.8); d.lineTo(5.8, -7.7); d.lineTo(4.2, -3.2); d.lineTo(2.2, -3.3);
  d.closePath(); d.fill();

  // 10. Dönen Elmas Pırlanta Parıltıları
  const glints = [
    [24, -6.5, 1.2, '#ffffff'],
    [-5, -16.5, 1.05, '#bae6fd'],
    [12, 13.5, 1.0, '#e879f9'],
    [-16, 9.5, 0.9, '#38bdf8'],
    [3, -12.5, 0.8, '#ffffff'],
    [20, 7.5, 0.75, '#c084fc']
  ];
  glints.forEach((s, i) => {
    const k = 0.5 + 0.5*Math.sin(spin*4.4 + i*1.6);
    if (k < 0.15) return;
    const r = s[2]*(2.8 + k*4.4);
    d.save();
    d.translate(s[0], s[1]);
    d.rotate(spin*0.85 + i*1.1);
    d.globalAlpha = k;

    // 8 Uçlu Pırlanta Yıldızı
    d.fillStyle = s[3];
    d.beginPath();
    d.moveTo(0, -r);
    d.quadraticCurveTo(0.4, -0.4, r, 0);
    d.quadraticCurveTo(0.4, 0.4, 0, r);
    d.quadraticCurveTo(-0.4, 0.4, -r, 0);
    d.quadraticCurveTo(-0.4, -0.4, 0, -r);
    d.closePath(); d.fill();

    d.fillStyle = '#ffffff';
    d.beginPath(); d.arc(0, 0, r*0.3, 0, TAU); d.fill();
    d.restore();
  });
}

let palCache = { key:'', val:null };
function palette(skinId, tintId){
  const key = skinId + '|' + tintId;
  if (palCache.key === key) return palCache.val;
  const sk = skinById(skinId);
  if (!sk.noTint && tintId === 'diamond'){
    palCache = {
      key,
      val: {
        main: '#a5f3fc',
        light: '#ffffff',
        pale:  '#e0f7fa',
        dark:  '#0284c7',
        deep:  '#0369a1',
        ink:   '#0c4a6e',
        glass: '#f0fdfa'
      }
    };
    return palCache.val;
  }
  const main = (sk.noTint ? null : tintById(tintId).color) || sk.base;
  palCache = { key, val: shade(main) };
  return palCache.val;
}
function shade(main){
  return {
    main,
    light: mix(main,'#ffffff',0.45),
    pale:  mix(main,'#ffffff',0.74),
    dark:  mix(main,'#000000',0.28),
    deep:  mix(main,'#000000',0.50),
    ink:   mix(main,'#0d1420',0.72),
    glass: '#a8dadc'
  };
}

/* ============================ ÇİZİM ============================ */
function parseCol(c){                        // '#rrggbb', '#rgb' ve 'rgb(r,g,b)' ayrıştırır
  if (!c) return [0,0,0];
  if (c[0] === '#'){
    if (c.length === 4){
      return [parseInt(c[1]+c[1],16), parseInt(c[2]+c[2],16), parseInt(c[3]+c[3],16)];
    }
    return [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
  }
  const m = c.match(/[\d.]+/g);
  return m && m.length >= 3 ? [+m[0], +m[1], +m[2]] : [0,0,0];
}
function mix(a, b, k){                       // iki rengi karıştırır
  const A = parseCol(a), B = parseCol(b);
  return 'rgb(' + Math.round(A[0]+(B[0]-A[0])*k) + ',' +
                  Math.round(A[1]+(B[1]-A[1])*k) + ',' +
                  Math.round(A[2]+(B[2]-A[2])*k) + ')';
}
const SKY_CALM = ['#2fa5cf','#63c9e0','#a9e6df'];
const SKY_RED  = ['#1b0a10', '#56141c', '#98251b', '#db4e20'];   // derin cehennem kızılı

function drawSky(){
  const k = chaosK;
  const g = ctx.createLinearGradient(0,0,0,SKY_H);
  if (k <= 0){
    g.addColorStop(0,   SKY_CALM[0]);
    g.addColorStop(.45, SKY_CALM[1]);
    g.addColorStop(1,   SKY_CALM[2]);
  } else {
    g.addColorStop(0,   mix(SKY_CALM[0], SKY_RED[0], k));
    g.addColorStop(.32, mix(SKY_CALM[1], SKY_RED[1], k));
    g.addColorStop(.68, mix(SKY_CALM[1], SKY_RED[2], k));
    g.addColorStop(1,   mix(SKY_CALM[2], SKY_RED[3], k));
  }
  ctx.fillStyle = g; ctx.fillRect(0,0,W,SKY_H);

  // Güneş — 20'den sonra zarif bir kan güneşi / tutulma halesine bürünür
  if (k > 0.05){
    const pulse = 1 + Math.sin(t*3.2)*0.08*k;
    const r = (72 + k*20) * pulse;
    // Dış alevli taç halesi
    const sg = ctx.createRadialGradient(330,88,8,330,88,r);
    sg.addColorStop(0, 'rgba(255,100,25,' + (0.70*k).toFixed(3) + ')');
    sg.addColorStop(.4, 'rgba(230,45,15,' + (0.45*k).toFixed(3) + ')');
    sg.addColorStop(1, 'rgba(120,10,10,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(330,88,r,0,TAU); ctx.fill();

    // Tutulma kara çekirdeği ve parlayan kor halkası
    ctx.fillStyle = mix('#fffcd6', '#180508', k);
    ctx.beginPath(); ctx.arc(330,88,38,0,TAU); ctx.fill();
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = 'rgba(255,' + Math.round(110 + 90*Math.sin(t*5)) + ',35,' + (0.65*k).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(330,88,38,0,TAU); ctx.stroke();
  } else {
    const r = 72;
    const sg = ctx.createRadialGradient(330,88,6,330,88,r);
    sg.addColorStop(0, 'rgba(255,252,214,.95)');
    sg.addColorStop(1, 'rgba(255,252,214,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(330,88,r,0,TAU); ctx.fill();
  }
}

// dünyanın geri kalanına yumuşak sıcak tonlama ve hafif kenar vinyeti (ekranı boğmaz)
function drawHeatWash(){
  const k = chaosK;
  if (k <= 0.01) return;
  const pulse = 1 + Math.sin(t*3.8)*0.10*k;
  // Yumuşak hafif sıcak ambiyans
  ctx.fillStyle = 'rgba(180,25,18,' + (k * 0.08 * pulse).toFixed(4) + ')';
  ctx.fillRect(0, 0, W, H);
  // Yalnızca dış kenarları çerçeveleyen zarif sinematik vinyet
  const vg = ctx.createRadialGradient(W/2, SKY_H*0.5, W*0.38, W/2, SKY_H*0.5, W*0.82);
  vg.addColorStop(0, 'rgba(100,6,10,0)');
  vg.addColorStop(1, 'rgba(60,4,8,' + (k * 0.30 * pulse).toFixed(4) + ')');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

// kızıl gerilimde tüm dünya paletini kavurur
const RED_INK = '#680c14';
const chaosTint = (c, w) => chaosK > 0 ? mix(c, RED_INK, chaosK*(w === undefined ? 0.60 : w)) : c;

function puff(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,TAU); ctx.fill(); }
function drawClouds(){
  for (const c of clouds){
    let x = (c.x - dist*0.12) % CLOUD_SPAN;
    if (x < -130) x += CLOUD_SPAN;

    ctx.globalAlpha = c.a * (1 - chaosK*0.35);
    ctx.fillStyle = chaosK > 0.05 ? mix('#ffffff', '#46141a', chaosK*0.85) : '#ffffff';
    ctx.translate(x, c.y); ctx.scale(c.s, c.s);
    puff(0,0,22); puff(24,-8,27); puff(52,2,20); puff(26,10,24);
    ctx.restore();
  }

}

function drawSkyline(){
  const off = (dist*0.28) % BSPAN;
  const base = SKY_H - 34;
  ctx.save();
  for (let pass=0; pass<2; pass++){
    const ox = -off + pass*BSPAN;
    for (const b of buildings){
      const x = ox + b.x;
      if (x > W+10 || x + b.w < -10) continue;
      ctx.fillStyle = chaosTint('#3f8fa8', 0.68);
      ctx.fillRect(x, base-b.h, b.w, b.h+34);
      ctx.fillStyle = 'rgba(255,255,255,.10)';
      ctx.fillRect(x, base-b.h, Math.min(6,b.w*0.3), b.h+34);
      if (b.tower){ ctx.fillStyle=chaosTint('#3f8fa8', 0.68); ctx.fillRect(x+b.w/2-2, base-b.h-16, 4, 16); }
      if (b.win){
        // Cehennem modunda pencereler alev gibi parlar
        ctx.fillStyle = chaosK > 0 ? mix('#c6f0ff', '#ff5a1a', chaosK) : '#c6f0ff';
        ctx.globalAlpha = 0.34 + chaosK*0.52;
        for (let wy = base-b.h+10; wy < base-6; wy += 16)
          for (let wx = x+6; wx < x+b.w-8; wx += 14) ctx.fillRect(wx, wy, 6, 8);
        ctx.globalAlpha = 1;
      }
    }
  }
  ctx.restore();
}

function drawBushes(){
  const off = (dist*0.55) % HSPAN;
  const base = SKY_H + 2;
  for (let pass=0; pass<2; pass++){
    const ox = -off + pass*HSPAN;
    ctx.fillStyle = chaosTint('#5fbf62', 0.70);
    for (const b of bushes){
      const x = ox + b.x;
      if (x > W+60 || x < -60) continue;

    }
  }

}

function drawGround(){
  const y = SKY_H;
  // Cehennem modunda kavrulmuş toprak
  ctx.fillStyle = chaosTint('#ded895', 0.68); ctx.fillRect(0, y, W, GROUND_H);
  // çim şeridi -> cehennemde kömürleşmiş zemin
  ctx.fillStyle = chaosTint('#7ed957', 0.74); ctx.fillRect(0, y, W, 16);
  ctx.fillStyle = chaosTint('#5cb844', 0.74); ctx.fillRect(0, y+13, W, 5);
  // eğik şeritler
  const off = dist % 26;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, y+18, W, GROUND_H-18); ctx.clip();

  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(0, y+18, W, 3);
