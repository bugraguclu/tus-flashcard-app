/* ============================ ATEŞ ============================ */
/* 20'den sonra ekranın altından yükselen zarif alev hattı + yumuşak kıvılcımlar (ekranı boğmaz) */
let embers = [], emberAcc = 0;

function updateFire(dt){
  if (chaosK > 0.04){
    emberAcc += dt * 32 * chaosK; // ferah ve zarif kıvılcım sıklığı
    while (emberAcc >= 1){
      emberAcc -= 1;
      embers.push({
        x: rnd(0, W),
        y: H + rnd(-4, 6),
        vx: rnd(-18, 18),
        vy: rnd(-140, -60),             // yumuşak ve akıcı süzülüş
        r: rnd(1.0, 2.4),
        life: rnd(1.2, 2.2),
        max: 2.2,
        ph: rnd(0, TAU)
      });
    }
  }
  for (const e of embers){
    e.life -= dt;
    e.x += (e.vx + Math.sin(t*2.4 + e.ph)*16) * dt;
    e.y += e.vy * dt;
    e.vy += 18*dt;
  }
  embers = embers.filter(e => e.life > 0 && e.y > SKY_H - 120);
  if (embers.length > 50) embers.splice(0, embers.length - 50);
}

const FIRE_LAYERS_BOTTOM = [
  { c:'rgba(170,12,16,',   a:0.65, h:115, sp:2.0, o:0.0, f:0.040 }, // derin kızıl dalga (zemin üstüne hafif taşar)
  { c:'rgba(240,70,18,',  a:0.72, h:85,  sp:2.8, o:1.8, f:0.056 }, // turuncu alev gövdesi
  { c:'rgba(255,180,30,', a:0.78, h:58,  sp:3.8, o:3.6, f:0.078 }, // altın alev dilleri
  { c:'rgba(255,248,180,',a:0.85, h:32,  sp:4.8, o:5.2, f:0.110 }  // taban beyaz-sıcak çekirdek
];

function drawFire(){
  const k = chaosK;
  if (k <= 0.01) return;
  const base = H; // Ekranın tam en alt sınırı (640px)
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // Ekranın altından yayılan yumuşak ve ferah sıcaklık ışıması
  const gh = 135*k;
  const glow = ctx.createLinearGradient(0, base - gh, 0, base);
  glow.addColorStop(0, 'rgba(255,50,15,0)');
  glow.addColorStop(.5, 'rgba(255,90,20,' + (0.16*k).toFixed(4) + ')');
  glow.addColorStop(1, 'rgba(255,145,35,' + (0.32*k).toFixed(4) + ')');
  ctx.fillStyle = glow; ctx.fillRect(0, base - gh, W, gh);

  // Dalgalanan 4 katmanlı akışkan alev dilleri
  for (const L of FIRE_LAYERS_BOTTOM){
    const flick = 0.88 + 0.12*Math.sin(t*10 + L.o*2.5);
    ctx.fillStyle = L.c + (L.a*k*flick).toFixed(4) + ')';
    ctx.beginPath();
    ctx.moveTo(-20, base);
    for (let x = -20; x <= W+20; x += 4){
      const p = x*L.f + L.o;
      const nz = Math.sin(p + t*L.sp)*0.48
               + Math.sin(p*2.25 - t*L.sp*1.4)*0.32
               + Math.sin(p*4.62 + t*L.sp*0.8)*0.20;
      const tongue = Math.pow(clamp(nz*0.5 + 0.5, 0, 1), 1.65);
      ctx.lineTo(x, base - (L.h*k) * (0.24 + 0.76*tongue));
    }
    ctx.lineTo(W+20, base); ctx.closePath(); ctx.fill();
  }

  // En alt tabanda kaynayan zarif erimiş lav çizgisi
  const magmaH = 10*k;
  const mg = ctx.createLinearGradient(0, base - magmaH, 0, base);
  mg.addColorStop(0, 'rgba(255,160,20,0.6)');
  mg.addColorStop(1, 'rgba(255,240,170,0.85)');
  ctx.fillStyle = mg; ctx.fillRect(0, base - magmaH, W, magmaH);

  ctx.restore();
}

function drawEmbers(){
  if (!embers.length) return;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const e of embers){
    const a = clamp(e.life/e.max, 0, 1);
    ctx.globalAlpha = a*0.85;
    ctx.fillStyle = a > 0.65 ? '#fff8cc' : (a > 0.32 ? '#ff9a2b' : '#e03010');
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r*(0.4 + a*0.6), 0, TAU); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ============================ BORULAR ============================ */
const PIPE_W = 68, CAP_H = 28, CAP_OVER = 5;
const PIPE_DX = 196;                 // borular arası yatay mesafe
let pipes = [];
let nextPipeAt = 0;

const CHAOS = 20;                    // bu skordan sonra iş ciddileşiyor
const GAP_MIN = 104;                 // uçak gövdesi 22 px — burada 82 px pay kalır
function gapFor(s){
  if (s < CHAOS) return 172 - s*1.7;                      // 172 → 140
  return Math.max(GAP_MIN, 130 - (s-CHAOS)*2.2);          // 20'de bir anda daralır, 32'de taban
}
function speedFor(s){
  if (s < CHAOS) return SPEED;
  return Math.min(SPEED + 14 + (s-CHAOS)*2.2, 190);       // eşikte ani ivme, sonra tırmanış
}
function pipeGapDX(s){
  return s < CHAOS ? PIPE_DX : Math.max(168, PIPE_DX - (s-CHAOS)*1.6);   // borular sıklaşır
}
// Seviye bazlı cehennem modu: Sadece o turda skor >= 20 olduğunda tetiklenir, yeni oyunda sıfırlanır
let hellActive = false;
let chaosK = 0;
function chaosFor(s){ return (hellActive || s >= CHAOS) ? 1 : 0; }
function toggleHellMode(){
  hellActive = !hellActive;
  chaosK = hellActive ? 1 : 0;
  Audio2.tension(chaosK);
  if (typeof showToast === 'function'){
    showToast(hellActive ? '🔥 Cehennem Modu Açıldı (Test)' : '🌤️ Normal Moda Dönüldü');
  }
  return hellActive;
}

/* Ardışık boruların dikey sıçraması, oyuncunun o hızda gerçekten tırmanabileceği
   kadarla sınırlanır — zorluk düşmez, imkânsız dizilim biter. */
let lastTop = null;
function spawnPipe(){
  const gap = gapFor(score);
  const margin = 70;
  const lo = margin, hi = SKY_H - margin - gap;
  let a = lo, b = hi;
  if (lastTop !== null){
    const reach = clamp((pipeGapDX(score) / speedFor(score)) * 150, 100, 190);
    a = Math.max(lo, lastTop - reach);
    b = Math.min(hi, lastTop + reach);
    if (a > b){ a = lo; b = hi; }
  }
  const top = rnd(a, b);                           // üst borunun bittiği y
  lastTop = top;
  pipes.push({ x: W + 40, top, gap, scored: false, near: Infinity, nearSide: 0, nearDone: false });
}

function drawPipe(p){
  const x = p.x, bottomY = p.top + p.gap;
  const T = c => chaosTint(c, 0.56);
  const body = ctx.createLinearGradient(x,0,x+PIPE_W,0);
  body.addColorStop(0,T('#5aa731')); body.addColorStop(.18,T('#8fdc55'));
  body.addColorStop(.52,T('#6cc63f')); body.addColorStop(.86,T('#3f7f22')); body.addColorStop(1,T('#356e1d'));

  ctx.lineWidth = 2; ctx.strokeStyle = chaosK > 0 ? mix('#2c5c18', '#1a0406', chaosK) : '#2c5c18';

  // gövdeler
  ctx.fillStyle = body;
  ctx.fillRect(x, -200, PIPE_W, p.top+200);          ctx.strokeRect(x, -200, PIPE_W, p.top+200);
  ctx.fillRect(x, bottomY, PIPE_W, SKY_H-bottomY);  ctx.strokeRect(x, bottomY, PIPE_W, SKY_H-bottomY);

  // ağızlıklar
  const cx = x - CAP_OVER, cw = PIPE_W + CAP_OVER*2;
  const cap = ctx.createLinearGradient(cx,0,cx+cw,0);
  cap.addColorStop(0,T('#5aa731')); cap.addColorStop(.2,T('#9ae85e'));
  cap.addColorStop(.55,T('#6cc63f')); cap.addColorStop(1,T('#356e1d'));
  ctx.fillStyle = cap;
  ctx.fillRect(cx, p.top-CAP_H, cw, CAP_H);         ctx.strokeRect(cx, p.top-CAP_H, cw, CAP_H);
  ctx.fillRect(cx, bottomY, cw, CAP_H);             ctx.strokeRect(cx, bottomY, cw, CAP_H);

  // parlama
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.fillRect(x+8, -200, 7, p.top+200);
  ctx.fillRect(x+8, bottomY+CAP_H, 7, SKY_H-bottomY-CAP_H);
}

/* ============================ SES MOTORU ============================ */
/* master  ← sfx
   master  ← warm(lowpass) ← duck ← music                                   */
const Audio2 = (() => {
  let ac = null, master = null, sfx = null, music = null, duck = null, mood = null, warm = null;
  let pendTension = 0;
  let musicOn = false, timer = null, nextT = 0, step = 0, tk = 0;
  const lvl = { master: 0.70, sfx: 0.80, music: 0.35, muted: false };

  function ready(){
    if (!ac){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain();
      sfx    = ac.createGain();
      music  = ac.createGain();
      duck   = ac.createGain();
      mood   = ac.createGain();                  // gerilimle müziği geri çeken kat
      warm = ac.createBiquadFilter();            // müziğin tizini yumuşatır
      warm.type = 'lowpass'; warm.frequency.value = 1900;
      sfx.connect(master);
      music.connect(mood); mood.connect(duck); duck.connect(warm); warm.connect(master);
      master.connect(ac.destination);
      applyLevels(0);
      if (pendTension) api.tension(pendTension);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function ramp(node, v, tc){
    if (node) node.gain.setTargetAtTime(v, ac.currentTime, tc === 0 ? 0.001 : (tc || 0.06));
  }
  function applyLevels(tc){
    if (!ac) return;
    ramp(master, lvl.muted ? 0 : lvl.master, tc);
    ramp(sfx, lvl.sfx, tc);
    ramp(music, lvl.music * 0.55, tc);          // müzik her zaman fonda kalsın
  }

  /* ---------- temel yapı taşları ---------- */
  function tone(type, f0, f1, dur, vol, delay){
    const c = ready(); if (!c) return;
    const t0 = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(sfx);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noiseBuffer(c, dur){
    const n = Math.floor(c.sampleRate * dur);
    const b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let k = 0; k < n; k++) d[k] = Math.random()*2 - 1;
    return b;
  }

  /* ---------- İTİŞ: tiz bip değil, yumuşak hava akışı ---------- */
  function thrust(){
    const c = ready(); if (!c) return;
    const t0 = c.currentTime;
    // süpüren hava
    const src = c.createBufferSource(); src.buffer = noiseBuffer(c, 0.22);
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 0.85;
    bp.frequency.setValueAtTime(280, t0);
    bp.frequency.exponentialRampToValueAtTime(1150, t0 + 0.075);
    bp.frequency.exponentialRampToValueAtTime(400, t0 + 0.22);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.085, t0 + 0.025);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    src.connect(bp); bp.connect(g); g.connect(sfx);
    src.start(t0);
    // altındaki motor gövdesi
    const o = c.createOscillator(), og = c.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(158, t0);
    o.frequency.exponentialRampToValueAtTime(86, t0 + 0.16);
    og.gain.setValueAtTime(0.0001, t0);
    og.gain.exponentialRampToValueAtTime(0.055, t0 + 0.02);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    o.connect(og); og.connect(sfx);
    o.start(t0); o.stop(t0 + 0.2);
  }
  function crash(){
    const c = ready(); if (!c) return;
    const t0 = c.currentTime;
    const src = c.createBufferSource(); src.buffer = noiseBuffer(c, 0.38);
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(2400, t0);
    lp.frequency.exponentialRampToValueAtTime(230, t0 + 0.38);
    const g = c.createGain();
    g.gain.setValueAtTime(0.26, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.38);
    src.connect(lp); lp.connect(g); g.connect(sfx);
    src.start(t0);
    tone('sawtooth', 210, 44, 0.3, 0.13);
  }
  function swoosh(){
    const c = ready(); if (!c) return;
    const t0 = c.currentTime;
    const src = c.createBufferSource(); src.buffer = noiseBuffer(c, 0.26);
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.7;
    bp.frequency.setValueAtTime(950, t0);
    bp.frequency.exponentialRampToValueAtTime(210, t0 + 0.26);
    const g = c.createGain();
    g.gain.setValueAtTime(0.07, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
    src.connect(bp); bp.connect(g); g.connect(sfx);
    src.start(t0);
  }

  /* ---------- FON MÜZİĞİ ----------
     SAKİN: Am · F · C · G, geniş ve yavaş.
     KIZIL: 20'den sonra devreye giren ayrı parça — yarım ses inen kararsız
            akorlar, triton, iki katı tempo ve sürekli vuran sub-nabız.      */
  const CHORDS      = [[57,60,64],[53,57,60],[48,55,64],[55,59,62]];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function voice(freq, t0, dur, vol, type, cut, detune){
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = type; o.frequency.value = freq; o.detune.value = detune || 0;
    f.type = 'lowpass'; f.frequency.value = cut;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + dur * 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(f); f.connect(g); g.connect(music);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function perc(t0, dur, f0, f1, vol, q){           // müzik yoluna giden gürültü vuruşu
    const src = ac.createBufferSource(); src.buffer = noiseBuffer(ac, dur);
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q || 1.2;
    bp.frequency.setValueAtTime(f0, t0);
    bp.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(music);
    src.start(t0); src.stop(t0 + dur + 0.03);
  }

  function stepCalm(chord, t0, i){
    if (i % 8 === 0){                                 // 8 adımda bir akor yastığı
      chord.forEach(m => {
        voice(mtof(m), t0, 4.4, 0.050, 'triangle', 1100, -5);
        voice(mtof(m), t0, 4.4, 0.036, 'sine',      880,   5);
      });
    }
    if (i % 2 === 0){                                 // üstteki sakin arpej
      const m = chord[Math.floor(i / 2) % chord.length] + 12;
      voice(mtof(m), t0, 1.2, 0.028, 'sine', 2400, 0);
    }
  }

  // ==================== YENİ YÜKSEK GERİLİM MÜZİK MOTORU (142 BPM) ====================
  const TENSE_BASS = [38, 38, 50, 38, 39, 38, 48, 39, 38, 38, 41, 38, 39, 38, 37, 38]; // D2 ostinato
  const TENSE_CHORDS = [
    [50, 53, 57, 63], // Dm (add b9 / Eb)
    [51, 54, 58, 62], // Ebm
    [48, 54, 57, 60], // C dim / triton
    [49, 52, 55, 61]  // C# dim
  ];

  function synthBass(m, t0, dur, vol){
    const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(mtof(m), t0);
    f.type = 'lowpass'; f.Q.value = 4.2;
    f.frequency.setValueAtTime(1600, t0);
    f.frequency.exponentialRampToValueAtTime(140, t0 + dur * 0.9);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(f); f.connect(g); g.connect(music);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  function kick(t0, vol){
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(170, t0);
    o.frequency.exponentialRampToValueAtTime(36, t0 + 0.12);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    o.connect(g); g.connect(music);
    o.start(t0); o.stop(t0 + 0.16);
    perc(t0, 0.02, 3200, 180, vol * 0.45, 1.0);
  }

  function siren(t0, dur, vol){
    const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(320, t0);
    o.frequency.linearRampToValueAtTime(760, t0 + dur * 0.85);
    f.type = 'bandpass'; f.Q.value = 2.0; f.frequency.value = 1100;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + dur * 0.4);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(f); f.connect(g); g.connect(music);
    o.start(t0); o.stop(t0 + dur + 0.04);
  }

  function stepRed(t0, i){
    // 1) 16'lık agresif synth bas hattı
    const bNote = TENSE_BASS[i % 16];
    const isAccent = (i % 4 === 0) || (i % 8 === 3);
    synthBass(bNote, t0, 0.095, isAccent ? 0.065 : 0.045);

    // 2) Davul & Ritim: Kalp atışı kick + snare + hızlı gerilim hi-hat
    if (i % 4 === 0) kick(t0, 0.095);
    else if (i % 8 === 6) kick(t0, 0.055);
    if (i % 8 === 4){
      perc(t0, 0.12, 2800, 120, 0.065, 0.9);
      voice(220, t0, 0.09, 0.025, 'triangle', 800, 0);
    }
    perc(t0, 0.03, 7200, 4200, (i % 2 === 1) ? 0.038 : 0.022, 2.5);

    // 3) Minör gerilim pedi (her 16 adımda bir)
    if (i % 16 === 0){
      const chord = TENSE_CHORDS[Math.floor(i / 16) % TENSE_CHORDS.length];
      chord.forEach((m, idx) => {
        voice(mtof(m), t0, 1.5, 0.024, idx % 2 === 0 ? 'sawtooth' : 'triangle', 1100, (idx-1.5)*12);
      });
    }

    // 4) Hızlı tedirgin edici staccato arpej
    if (i % 2 === 0){
      const leadNotes = [74, 77, 75, 81, 74, 75, 78, 82];
      const m = leadNotes[(i >> 1) % leadNotes.length];
      voice(mtof(m), t0, 0.07, 0.026, 'square', 2200, 0);
    }

    // 5) 32 adımda bir tırmanan siren
    if (i % 32 === 16){
      siren(t0, 1.35, 0.035);
    }
  }

  let wasRed = false;
  function schedule(){
    const c = ready(); if (!c || !musicOn) return;
    if (nextT < c.currentTime) nextT = c.currentTime + 0.06;
    const red = tk > 0.5;
    if (red !== wasRed){
      wasRed = red;
      step = 0;
      nextT = c.currentTime + 0.04;
    }
    const dur = red ? 0.105 : 0.46; // kırmızıda 142 BPM 16'lık tempo!
    const set = CHORDS;
    while (nextT < c.currentTime + 1.2){
      if (red) {
        stepRed(nextT, step);
      } else {
        const chord = set[Math.floor(step / 8) % set.length];
        stepCalm(chord, nextT, step);
      }
      nextT += dur; step++;
    }
  }

  const api = {
    unlock(){ if (!ready()) return null; this.startMusic(); return ac; },
    thrust, crash, swoosh,
    score(mult){
      const k = mult || 1;
      tone('sine', 784*k, 784*k, 0.10, 0.075);
      tone('sine', 1175*k, 1175*k, 0.14, 0.065, 0.075);
    },
    deny(){ tone('square', 190, 120, 0.13, 0.09); tone('square', 150, 96, 0.16, 0.07, 0.1); },
    /* level: 1 kıl payı · 2 efsane · 3 iğne deliği (eski boolean da desteklenir) */
    nearMiss(level, combo){
      const c = ready(); if (!c) return;
      const q = clamp(level === true ? 2 : (level|0) || 1, 1, 3);
      const dur = [0, 0.24, 0.35, 0.46][q];
      const t0 = c.currentTime;
      const src = c.createBufferSource(); src.buffer = noiseBuffer(c, dur);
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4 + q*0.35;
      bp.frequency.setValueAtTime(1200, t0);
      bp.frequency.exponentialRampToValueAtTime(2800 + q*500, t0 + 0.08);
      bp.frequency.exponentialRampToValueAtTime(600, t0 + dur);
      const g = c.createGain();
      g.gain.setValueAtTime(0.001, t0);
      g.gain.exponentialRampToValueAtTime([0, 0.11, 0.16, 0.2][q], t0 + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(bp); bp.connect(g); g.connect(sfx);
      src.start(t0);

      // Zincir uzadıkça akort yükselir (her adımda yarım ses, en çok bir oktav).
      const step = Math.min(12, Math.max(0, (combo|0) - 1));
      const root = [0, 880, 1046.5, 1318.5][q] * Math.pow(2, step/24);
      tone('sine', root, root, 0.28, 0.08, 0.01);
      tone('sine', root * 1.5, root * 1.5, 0.34, 0.065, 0.04);
      if (q >= 2) tone('sine', root * 2.0, root * 2.0, 0.40, 0.05, 0.08);
      if (q >= 3) tone('triangle', root * 3.0, root * 4.0, 0.34, 0.035, 0.12);
    },
    unlockFanfare(){
      const chord = [523.25, 659.25, 783.99, 1046.5];
      chord.forEach((f, i) => {
        tone('triangle', f, f, 0.48, 0.10, i * 0.07);
        tone('sine', f*2, f*2, 0.55, 0.06, i * 0.07 + 0.02);
      });
    },
    popper(){
      const c = ready(); if (!c) return;
      const t0 = c.currentTime;
      const src = c.createBufferSource(); src.buffer = noiseBuffer(c, 0.5);
      const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.6;
      bp.frequency.setValueAtTime(1600, t0);
      bp.frequency.exponentialRampToValueAtTime(300, t0 + 0.5);
      const g = c.createGain();
      g.gain.setValueAtTime(0.16, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
      src.connect(bp); bp.connect(g); g.connect(sfx);
      src.start(t0);
      tone('triangle', 320, 1250, 0.16, 0.10);         // patlama yükselişi
      [0,4,7,12].forEach((n,i) => tone('sine', 523.25*Math.pow(2,n/12), 523.25*Math.pow(2,n/12), 0.34, 0.05, 0.05 + i*0.045));
    },
    die(){ tone('sawtooth', 360, 58, 0.6, 0.09, 0.12); tone('sine', 165, 42, 0.55, 0.07, 0.14); },
    // 20'yi geçme anı: aşağı çöken bir darbe + yükselen alarm
    chaosHit(){
      const c = ready(); if (!c) return;
      const t0 = c.currentTime;
      const src = c.createBufferSource(); src.buffer = noiseBuffer(c, 0.9);
      const lp = c.createBiquadFilter(); lp.type = 'lowpass';
      lp.frequency.setValueAtTime(320, t0);
      lp.frequency.exponentialRampToValueAtTime(2600, t0 + 0.55);
      lp.frequency.exponentialRampToValueAtTime(240, t0 + 0.9);
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.14, t0 + 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
      src.connect(lp); lp.connect(g); g.connect(sfx);
      src.start(t0);
      tone('sawtooth', 62, 34, 1.0, 0.13);            // yere çakılan alt darbe
      tone('sawtooth', 220, 466, 0.7, 0.05, 0.05);    // triton alarmı
    },
    startMusic(){
      if (musicOn || !ac) return;
      musicOn = true; nextT = ac.currentTime + 0.2; step = 0;
      schedule();
      timer = setInterval(schedule, 250);
    },
    duck(on){ if (ac) ramp(duck, on ? 0.4 : 1, 0.25); },
    // 0 → 1: müzik geri çekilmez, gerginleşir
    tension(k){
      tk = k;
      if (!ac){ pendTension = k; return; }
      mood.gain.setTargetAtTime(1 + 0.55*k, ac.currentTime, 0.35);         // öne çıkar
      warm.frequency.setTargetAtTime(1900 + 1900*k, ac.currentTime, 0.35);  // tizi açılır, sertleşir
    },
    setLevels(v){ Object.assign(lvl, v); applyLevels(); },
    get levels(){ return lvl; }
  };
  return api;
})();

let parts = [];
function burst(x, y, n, kind){
  for (let i=0;i<n;i++){
    const a = rnd(0, TAU), sp = rnd(40, 230);
    parts.push({
      x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 60,
      r: rnd(2.5, 5.5), rot: rnd(0,TAU), vr: rnd(-9,9),
      life: rnd(0.5, 1.1), max: 1.1,
      g: (kind === 'gold' || kind === 'goldSpark') ? 0.18 : 1,                 // altın kıvılcım havada asılı kalır
      c: kind === 'dust' ? ['#cfc784','#ded895','#b9ae6d'][i%3]
       : (kind === 'gold' || kind === 'goldSpark') ? ['#ffffff','#fff4b8','#ffd700','#ffaa00','#ff7700'][i%5]
                         : ['#adb5bd','#6c757d','#e63946','#ffb703'][i%4],
      sparkle: kind === 'goldSpark',
      feather: kind === 'debris' && i % 2 === 0
    });
  }
}

function updateParts(dt){
  for (const p of parts){
    p.vy += 900*p.g*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= (1 - 1.4*dt); p.rot += (p.vr || 0)*dt; p.life -= dt;
  }
  parts = parts.filter(p => p.life > 0 && p.y < H+30);
}

function drawParts(){
  for (const p of parts){
    ctx.save();
    ctx.globalAlpha = clamp(p.life/0.5, 0, 1);
    ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
    ctx.fillStyle = p.c;
    if (p.heart){
      const s = p.r * 0.75;
      ctx.beginPath();
      ctx.moveTo(0, s*0.3);
      ctx.bezierCurveTo(-s, -s*0.7, -s*1.4, s*0.4, 0, s*1.4);
      ctx.bezierCurveTo(s*1.4, s*0.4, s, -s*0.7, 0, s*0.3);
      ctx.fill();
    } else if (p.sparkle){
      const r = p.r;
      ctx.beginPath();
      ctx.moveTo(0, -r*1.7);
      ctx.quadraticCurveTo(0.2, -0.2, r*1.7, 0);
      ctx.quadraticCurveTo(0.2, 0.2, 0, r*1.7);
      ctx.quadraticCurveTo(-0.2, 0.2, -r*1.7, 0);
      ctx.quadraticCurveTo(-0.2, -0.2, 0, -r*1.7);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      if (p.feather) ctx.ellipse(0,0,p.r*1.5,p.r*0.72,0,0,TAU);
      else ctx.arc(0,0,p.r*0.8,0,TAU);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ================= KIL PAYI YAKINLIK GÖSTERGESİ =================
   Boru ağzından geçerken sürtülen kenar, kalan paya göre parlar:
   sarı (14px) → turuncu → beyaz-sıcak (temas sınırı). */
function drawNearProximity(){
  if (state !== 'play') return;
  const b = birdBox();
  for (const p of pipes){
    const cx = p.x - CAP_OVER, cw = PIPE_W + CAP_OVER*2;
    if (b.x + b.w < cx || b.x > cx + cw) continue;
    const bottomY = p.top + p.gap;
    const dTop = b.y - p.top, dBot = bottomY - (b.y + b.h);
    const c = Math.min(dTop, dBot);
    if (c > NEAR_OK || c < -3) continue;
    const k = clamp(1 - Math.max(0, c) / NEAR_OK, 0, 1);       // 0 uzak → 1 sürtünme
    const top = dTop <= dBot;
    const edgeY = top ? p.top : bottomY;
    const h = 8 + 26*k;
    const col = k > 0.72 ? [255,255,235] : k > 0.45 ? [255,206,90] : [255,170,40];
    const rgb = col[0] + ',' + col[1] + ',' + col[2];
    ctx.save();
    const g = ctx.createLinearGradient(0, top ? edgeY - h : edgeY + h, 0, edgeY);
    g.addColorStop(0, 'rgba(' + rgb + ',0)');
    g.addColorStop(1, 'rgba(' + rgb + ',' + (0.42*k).toFixed(3) + ')');
    ctx.fillStyle = g;
    ctx.fillRect(cx, top ? edgeY - h : edgeY, cw, h);
    // kenar çizgisi: nabız gibi titreşir
    const pl = 0.72 + 0.28*Math.sin(t*22);
    ctx.fillStyle = 'rgba(' + rgb + ',' + (0.85*k*pl).toFixed(3) + ')';
    ctx.fillRect(cx, top ? edgeY - 2 : edgeY, cw, 2);
    // uçağın hizasında kalan payı gösteren ince ölçü çizgisi
    if (k > 0.35){
      const mx = clamp(bird.x, cx + 4, cx + cw - 4);
      ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.7*k).toFixed(3) + ')';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.moveTo(mx, edgeY);
      ctx.lineTo(mx, top ? b.y : b.y + b.h);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }
}

let rings = [];
function ringAdd(x, y, tier){ rings.push({ x, y, life: 0.5, tier }); }
function updateRings(dt){
  for (const r of rings) r.life -= dt;
  rings = rings.filter(r => r.life > 0);
}
const RING_COL = ['#ffd257', '#ffd257', '#fff6c9', '#ffffff'];
const RING_A   = [0.7, 0.7, 0.95, 1];
const RING_LW  = [3, 3, 4.5, 6];
const RING_R   = [33, 33, 48, 66];
function drawRings(){
  for (const r of rings){
    const k = 1 - r.life/0.5;
    const q = clamp(r.tier|0, 1, 3);
    ctx.save();
    ctx.globalAlpha = (1-k) * RING_A[q];
    ctx.strokeStyle = RING_COL[q];
    ctx.lineWidth = RING_LW[q] * (1-k) + 0.6;
    ctx.beginPath(); ctx.arc(r.x, r.y, 13 + k*RING_R[q], 0, TAU); ctx.stroke();
    if (q >= 3){                                   // iğne deliği: ikinci, gecikmeli halka
      ctx.globalAlpha = (1-k) * 0.5;
      ctx.lineWidth = 2.4 * (1-k) + 0.5;
      ctx.beginPath(); ctx.arc(r.x, r.y, 8 + k*40, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

const CONF_COL = ['#ff595e','#ffca3a','#8ac926','#1982c4','#6a4c93','#ff9f1c','#ffffff','#f72585'];
let confetti = [];
let milestoneT = 0, milestoneTxt = '';

function confettiAdd(x, y, n, power, spread, dir){
  for (let i = 0; i < n; i++){
    const a = dir + rnd(-spread, spread);
    const sp = power * rnd(0.55, 1.15);
    confetti.push({
      x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      w: rnd(5, 10), h: rnd(3.5, 6),
      rot: rnd(0, TAU), vr: rnd(-11, 11),
      flip: rnd(0, TAU), vf: rnd(4, 9),
      sway: rnd(0, TAU), swayS: rnd(1.6, 3.4),
      c: CONF_COL[(Math.random()*CONF_COL.length)|0],
      life: rnd(1.7, 3.0)
    });
  }
  if (confetti.length > 320) confetti.splice(0, confetti.length - 320);
}
// iki yandan yukarı ateşleyen parti topu
function confettiPopper(){
  confettiAdd(-6,  SKY_H-40, 34, 560, 0.42, -Math.PI/3.4);
  confettiAdd(W+6, SKY_H-40, 34, 560, 0.42, -Math.PI + Math.PI/3.4);
  confettiAdd(W/2, 120, 26, 300, Math.PI, 0);
}
function updateConfetti(dt){
  for (const c of confetti){
    c.vy += 380*dt;                       // kâğıt olduğu için hafif yerçekimi
    c.vx *= (1 - 1.1*dt);
    c.vy *= (1 - 0.9*dt);                 // hava direnci: düşüşü yavaşlatır
    c.sway += c.swayS*dt;
    c.x += (c.vx + Math.cos(c.sway)*34)*dt;
    c.y += c.vy*dt;
    c.rot += c.vr*dt;
    c.flip += c.vf*dt;
    c.life -= dt;
  }
  confetti = confetti.filter(c => c.life > 0 && c.y < H + 24);
}
function drawConfetti(){
  for (const c of confetti){
    const f = Math.cos(c.flip);
    ctx.save();
    ctx.globalAlpha = clamp(c.life/0.6, 0, 1);
    ctx.translate(c.x, c.y);
    ctx.rotate(c.rot);
    ctx.scale(Math.max(0.12, Math.abs(f)), 1);   // kağıdın dönerken incelmesi
    ctx.fillStyle = c.c;
    ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    if (f < 0){                                   // arka yüzü koyu
      ctx.fillStyle = 'rgba(0,0,0,.28)';
      ctx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

let state = 'ready';                 // ready | play | dead | over

  chaosK = 0; lastTension = 0; Audio2.tension(0);
  runEarn = 0; runBonus = 0; runMedalBonus = 0; runBestBonus = 0; runNear = 0; coinPops = [];
  runNearCoins = 0; runNearTier = 0; nearCombo = 0; nearComboBest = 0; nearComboT = 0; nearSlowT = -9;
  slowMoT = 0; slowMoScale = 1; slowMoDur = 0.35; nearFlash = 0;
  bird.x = 126; bird.y = SKY_H*0.44; bird.vy = 0; bird.rot = 0; bird.flapT = 0;
  nextPipeAt = dist + 120;
  newBest = false; overT = 0; shake = 0; flash = 0; pop = 0; chaosFlash = 0;
  state = 'ready';
}

function resetAllProgress(){
  store.remove('flappy.wallet');
  store.remove('flappy.best');
  store.remove('flappy.hellMode');
  store.remove('flappy.nearcombo');
  best = 0; nearRecord = 0;
  hellActive = false;
  Wallet.resetAll();
  coinShown = Wallet.coins;
  reset();
  if (typeof Shop !== 'undefined' && Shop.refresh) Shop.refresh();
}
window.resetFlappyProgress = resetAllProgress;

function flap(){
  Audio2.unlock();
  if (paused) return;
  if (state === 'ready'){ state = 'play'; nextPipeAt = dist + 90; }
  if (state === 'play'){ bird.vy = FLAP; bird.flapT = 0.22; Audio2.thrust(); emitCostumeFlap(bird.x, bird.y, Wallet.skin); }
  else if (state === 'over' && overT > 0.55){ Audio2.swoosh(); reset(); }
}

function die(hitGround = false){
  if (state !== 'play') return;
  state = hitGround ? 'over' : 'dead';
  overT = 0;
  shake = 0.42; flash = 0.9;
  slowMoT = 0; slowMoScale = 1; slowMoDur = 0.35; nearFlash = 0; nearCombo = 0; nearComboT = 0;
  burst(bird.x + 6, bird.y, 16, 'debris');
  Audio2.crash();
  if (!hitGround){
    Audio2.die();
  } else {
    burst(bird.x, SKY_H, 10, 'dust');
    bird.vy = 0;
    bird.rot = Math.PI / 2;
  }
  SKINS.filter(s => s.unlockScore).forEach(s => {
    if (score >= s.unlockScore && !Wallet.owns(s.id)){
      Wallet.grant(s.id);
    }
  });
  // Prim yalnızca madalya kazanıldığında verilir; rekor primi de madalyaya göre ölçeklenir.
  const m = medalFor(score);
  runMedalBonus = m ? (PAY_MEDAL[m.n] || 0) : 0;
  runBestBonus  = (m && score > best) ? (PAY_BEST[m.n] || 0) : 0;
  runBonus = runMedalBonus + runBestBonus;
  if (runBonus > 0){ Wallet.add(runBonus); runEarn += runBonus; }
  if (score > best){ best = score; newBest = true; store.set('flappy.best', best); }
}

/* ============================ ÇARPIŞMA ============================ */
function birdBox(){
  return { x: bird.x - BIRD_RX + 2, y: bird.y - BIRD_RY + 2,
           w: BIRD_RX*2 - 4,        h: BIRD_RY*2 - 4 };
}
const overlap = (b, x, y, w, h) => b.x < x+w && b.x+b.w > x && b.y < y+h && b.y+b.h > y;

/* Ağızlıklar gövdeden CAP_OVER kadar taşar; çizilen her parça çarpışmaya dahildir. */
function hits(p){
  const b = birdBox(), bottomY = p.top + p.gap;
  const cx = p.x - CAP_OVER, cw = PIPE_W + CAP_OVER*2;
  return overlap(b, p.x, -200, PIPE_W, p.top + 200)            ||
         overlap(b, p.x, bottomY, PIPE_W, SKY_H - bottomY)     ||
         overlap(b, cx, p.top - CAP_H, cw, CAP_H)              ||
         overlap(b, cx, bottomY, cw, CAP_H);
}

/* Boru boyunca kalan en küçük dikey payı takip eder (kıl payı primi için).
   Ağızlık kovanının tamamı geçildiğinde prim/zincir kararı verilir. */
function trackNear(p){
  const b = birdBox();
  const cx = p.x - CAP_OVER, cw = PIPE_W + CAP_OVER*2;
  if (b.x + b.w < cx) return;                       // boruya henüz girilmedi
  if (b.x > cx + cw){ resolveNear(p); return; }     // boru tamamen geçildi
  const dTop = b.y - p.top, dBot = (p.top + p.gap) - (b.y + b.h);
  const c = Math.min(dTop, dBot);
  if (c < p.near){ p.near = c; p.nearSide = dTop <= dBot ? -1 : 1; }
}

/* Boru geçildi: kademe varsa primi ver, yoksa zinciri kır. */
function resolveNear(p){
  if (p.nearDone) return;
  p.nearDone = true;
  const tier = p.near < Infinity ? nearTierFor(p.near) : null;
  if (!tier){ nearCombo = 0; return; }
  awardNear(p, tier);
}

function awardNear(p, tier){
  nearCombo++;
  nearComboBest = Math.max(nearComboBest, nearCombo);
  const mult  = nearMult(nearCombo);
  const bonus = Math.round(tier.pay * mult);
  Wallet.add(bonus);
  runEarn += bonus; runNearCoins += bonus; runNear++;
  runNearTier = Math.max(runNearTier, tier.tier);
  nearComboT = 2.6; coinPulse = 1;

  const k = tier.tier;
  // Ağır çekim art arda tetiklenip oyunu ağırlaştırmasın: kısa bir bekleme uygula.
  if (t - nearSlowT > 0.8 || k >= 3){
    nearSlowT   = t;
    slowMoDur   = [0, 0.22, 0.32, 0.42][k];
    slowMoT     = slowMoDur;
    slowMoScale = [1, 0.48, 0.34, 0.24][k];
  }
  nearFlash = Math.max(nearFlash, [0, 0.6, 0.85, 1][k]);
  if (k >= 3) shake = Math.max(shake, 0.16);
  ringAdd(bird.x, bird.y, k);
  burst(bird.x, bird.y, [0, 9, 16, 24][k], 'goldSpark');

  const side = p.nearSide < 0 ? -1 : 1;             // pop, sürtülen kenarın karşısına çıksın
  const txt  = '+' + bonus + (mult > 1 ? '  ' + fmtMult(mult) : '') + '  ' + tier.name;
  coinPop(txt, bird.x + 30, bird.y - side*26, tier.col, tier.size);
  Audio2.nearMiss(k, nearCombo);

  if (nearCombo >= 3 && nearCombo % 3 === 0){
    confettiAdd(bird.x + 10, bird.y, 10, 220, Math.PI, 0);
    milestoneTxt = '⚡ KIL PAYI ZİNCİRİ ' + fmtMult(nearCombo).replace('×','x') + '  ·  prim ' + fmtMult(mult);
    milestoneT = 1.2;
  }
  if (nearComboBest > nearRecord){
    nearRecord = nearComboBest; store.set('flappy.nearcombo', nearRecord);
  }
}

/* ============================ GÜNCELLEME ============================ */
function update(dt){
  if (paused) return;
  t += dt;
  shake = Math.max(0, shake - dt);
  flash = Math.max(0, flash - dt*2.6);
  chaosFlash = Math.max(0, chaosFlash - dt*1.5);
  nearFlash = Math.max(0, nearFlash - dt*3.2);
  nearComboT = Math.max(0, nearComboT - dt);
  pop   = Math.max(0, pop   - dt*3.2);
  updateParts(dt);
  updateRings(dt);
  updateFire(dt);
  updateConfetti(dt);
  updateCoinPops(dt);
  milestoneT = Math.max(0, milestoneT - dt);
  giftT = Math.max(0, giftT - dt);
  coinPulse = Math.max(0, coinPulse - dt*2.2);
  if (Math.abs(coinShown - Wallet.coins) > 0.5){
    coinShown += (Wallet.coins - coinShown) * Math.min(1, dt*9);
    coinPulse = 1;
  } else coinShown = Wallet.coins;

  const spd = speedFor(score);
  const ck = (state === 'ready') ? 0 : (hellActive || score >= CHAOS ? 1 : 0);
  chaosK += (ck - chaosK) * Math.min(1, dt * 2.2);      // yumuşak ve akıcı geçiş
  if (Math.abs(chaosK - lastTension) > 0.02){ lastTension = chaosK; Audio2.tension(chaosK); }
  if (state !== 'dead' && state !== 'over') dist += spd*dt;

  if (state === 'ready'){
    bird.wing += dt*11;
    bird.y = SKY_H*0.44 + Math.sin(t*2.6)*8;
    bird.rot = Math.sin(t*2.6)*0.10;
    return;
  }

  if (state === 'play'){
    bird.vy = Math.min(bird.vy + GRAVITY*dt, MAX_FALL);
    bird.y += bird.vy*dt;

    bird.flapT = Math.max(0, bird.flapT - dt);
    bird.wing += dt * (bird.flapT > 0 ? 26 : 9);

    const target = bird.vy < 0 ? -0.52 : clamp(bird.vy/560, -0.5, 1.5);
    bird.rot += (target - bird.rot) * Math.min(1, dt*(bird.vy < 0 ? 18 : 7));

    // Altın Mekik için göksel kuyruklu yıldız / yıldız tozu izi
    if (Wallet.skin === 'shuttle' && Math.random() < 0.55){
      parts.push({
        x: bird.x - 22 + rnd(-2, 2),
        y: bird.y + rnd(-3, 3),
        vx: rnd(-75, -25),
        vy: rnd(-18, 18),
        r: rnd(1.6, 3.4),
        rot: rnd(0, TAU),
        vr: rnd(-6, 6),
        life: rnd(0.35, 0.7),
        max: 0.7,
        g: 0.05,
        c: ['#ffffff', '#fff7be', '#ffd700', '#ffa726', '#48cae4'][Math.floor(Math.random()*5)],
        sparkle: true
      });
    }

    // Elmas Mekik için kristal elmas yıldız tozu izi
    if (Wallet.skin === 'diamond_shuttle' && Math.random() < 0.65){
      parts.push({
        x: bird.x - 22 + rnd(-2, 2),
        y: bird.y + rnd(-3, 3),
        vx: rnd(-85, -30),
        vy: rnd(-20, 20),
        r: rnd(1.8, 3.8),
        rot: rnd(0, TAU),
        vr: rnd(-7, 7),
        life: rnd(0.4, 0.8),
        max: 0.8,
        g: 0.04,
        c: ['#ffffff', '#e0f7fa', '#80deea', '#00e5ff', '#c5cae9', '#e1bee7'][Math.floor(Math.random()*6)],
        sparkle: true
      });
    }

    // Elmas rengi aktifken modellerin arkasından süzülen elmas ışıltıları
    if (Wallet.tint === 'diamond' && !skinById(Wallet.skin).noTint && Math.random() < 0.28){
      parts.push({
        x: bird.x - 18 + rnd(-3, 3),
        y: bird.y + rnd(-5, 5),
        vx: rnd(-65, -20),
        vy: rnd(-15, 15),
        r: rnd(1.4, 2.8),
        rot: rnd(0, TAU),
        vr: rnd(-5, 5),
        life: rnd(0.3, 0.6),
        max: 0.6,
        g: 0.04,
        c: ['#ffffff', '#bbf2f6', '#7dd3fc', '#bae6fd'][Math.floor(Math.random()*4)],
        sparkle: true
      });
    }

    if (bird.y < BIRD_RY){ bird.y = BIRD_RY; bird.vy = Math.max(bird.vy, 0); }

    if (dist >= nextPipeAt){ spawnPipe(); nextPipeAt = dist + pipeGapDX(score); }

    for (const p of pipes){
      p.x -= spd*dt;
      trackNear(p);
      if (!p.scored && p.x + PIPE_W * 0.5 <= bird.x){
        p.scored = true; score++; pop = 1;
        const pay = score >= CHAOS ? PAY_PIPE_CHAOS : PAY_PIPE;
        Wallet.add(pay); runEarn += pay;
        coinPop('+' + pay, bird.x + 26, bird.y - 18);

        // 30 skor Altın Mekik ve 40 skor Elmas Mekik açılışı
        if (score === 30 && !Wallet.owns('shuttle')){
          Wallet.grant('shuttle');
          milestoneTxt = '🌟 EFSANEVİ AÇILDI: ALTIN MEKİK! 🌟';
          milestoneT = 3.6;
          confettiPopper();
          confettiAdd(W/2, 90, 50, 480, Math.PI, 0);
          Audio2.popper();
          Audio2.unlockFanfare();
          showToast('🚀 TEBRİKLER! 30 Skora ulaştın, Altın Mekik Açıldı!');
        } else if (score === 40 && !Wallet.owns('diamond_shuttle')){
          Wallet.grant('diamond_shuttle');
          milestoneTxt = '💎 MİTOLOJİK AÇILDI: ELMAS MEKİK! 💎';
          milestoneT = 4.2;
          confettiPopper();
          confettiAdd(W/2, 90, 70, 560, Math.PI, 0);
          Audio2.popper();
          Audio2.unlockFanfare();
          showToast('💎 İNANILMAZ! 40 Skora ulaştın, Elmas Mekik Açıldı!');
        } else if (score >= CHAOS && score % 10 === 0){          // 20, 30, 40 … tam salvo
          confettiPopper();
          if (score === CHAOS){                            // seviye bazlı tetikleme (20+)
            hellActive = true;
            milestoneTxt = '🔥 CEHENNEM MODU 🔥';
            chaosFlash = 0.55;
            shake = Math.max(shake, 0.35);
            Audio2.chaosHit();
            Audio2.tension(1);
          } else {
            const m = medalFor(score);
            milestoneTxt = m ? score + '  ·  ' + m.n : String(score);
          }
          milestoneT = 1.8;
          Audio2.popper();
          Audio2.score(1.25);
        } else if (score > CHAOS){                        // sonrası her puanda serpme
          confettiAdd(bird.x + 10, bird.y, 12, 240, Math.PI, 0);
          Audio2.score(1 + Math.min(0.45, (score-CHAOS)*0.018));
        } else {
          Audio2.score();
        }
      }
      if (hits(p)){ die(false); return; }
    }
    pipes = pipes.filter(p => p.x + PIPE_W + CAP_OVER > -12);

    if (bird.y + BIRD_RY >= SKY_H){
      bird.y = SKY_H - BIRD_RY;
      die(true);
      return;
    }
    return;
  }

  if (state === 'dead'){
    bird.vy = Math.min(bird.vy + GRAVITY*1.15*dt, MAX_FALL);
    bird.y += bird.vy*dt;
    bird.rot = Math.min(bird.rot + dt*6.5, Math.PI/2);
    if (bird.y + BIRD_RY >= SKY_H){
      bird.y = SKY_H - BIRD_RY; bird.vy = 0; bird.rot = Math.PI/2;
      burst(bird.x, SKY_H, 10, 'dust');
      state = 'over'; overT = 0; shake = Math.max(shake, 0.18);
    }
    return;
  }

  if (state === 'over') overT += dt;
}

/* ============================ ARAYÜZ ============================ */
function outlined(text, x, y, size, fill, weight){
  ctx.font = (weight||700)+' '+size+'px "Trebuchet MS", Verdana, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size*0.17);
  ctx.strokeStyle = '#2b2417'; ctx.strokeText(text, x, y);
  ctx.fillStyle = fill || '#fff';  ctx.fillText(text, x, y);
}
function panel(x,y,w,h){
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
  ctx.fillStyle = '#e6dfa6';
  ctx.beginPath(); ctx.roundRect(x,y,w,h,14); ctx.fill();
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = '#7d7237';
  ctx.beginPath(); ctx.roundRect(x,y,w,h,14); ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.roundRect(x+5,y+5,w-10,h-10,10); ctx.stroke();
}
function medalFor(s){
  if (s >= 40) return { a:'#e9f2f7', b:'#9fb6c4', n:'PLATİN' };
  if (s >= 30) return { a:'#ffe9a3', b:'#d8a325', n:'ALTIN'  };
  if (s >= 20) return { a:'#f0f0f2', b:'#a9a9b4', n:'GÜMÜŞ'  };
  if (s >= 10) return { a:'#f0c08a', b:'#a86a2c', n:'BRONZ'  };
  return null;
}
function drawMedal(cx, cy, m){
  const g = ctx.createLinearGradient(cx-26, cy-26, cx+26, cy+26);
  g.addColorStop(0, m.a); g.addColorStop(1, m.b);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, 26, 0, TAU); ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.28)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(cx, cy, 17, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.font = '700 10px "Trebuchet MS", sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(m.n, cx, cy+1);
}
function iconBtn(x, y, kind){
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.arc(x, y, 16, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  if (kind === 'mute' || kind === 'sound'){
    ctx.beginPath(); ctx.moveTo(x-7,y-3); ctx.lineTo(x-3,y-3); ctx.lineTo(x+1,y-7);
    ctx.lineTo(x+1,y+7); ctx.lineTo(x-3,y+3); ctx.lineTo(x-7,y+3); ctx.closePath(); ctx.fill();
    if (kind === 'mute'){
      ctx.beginPath(); ctx.moveTo(x+4,y-4); ctx.lineTo(x+9,y+4); ctx.moveTo(x+9,y-4); ctx.lineTo(x+4,y+4); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x+3, y, 5, -0.9, 0.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(x+3, y, 8.5, -0.8, 0.8); ctx.stroke();
    }
  } else if (kind === 'pause'){
    ctx.fillRect(x-5,y-6,3.5,12); ctx.fillRect(x+1.5,y-6,3.5,12);
  } else {
    ctx.beginPath(); ctx.moveTo(x-4,y-6); ctx.lineTo(x+6,y); ctx.lineTo(x-4,y+6); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
const BTN_SOUND = { x: W-32, y: 32 }, BTN_PAUSE = { x: W-72, y: 32 };

/* madeni para: altın disk, koyu kenar, dört uçlu kabartma ve üst parlama */
function coinIcon(x, y, r){
  ctx.save(); ctx.translate(x, y);
  const g = ctx.createLinearGradient(-r, -r, r, r);
  g.addColorStop(0,'#fff2ae'); g.addColorStop(.48,'#ffc93c'); g.addColorStop(1,'#dd8a00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
  ctx.lineWidth = Math.max(1, r*0.16); ctx.strokeStyle = 'rgba(116,64,0,.62)'; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.26)';
  ctx.beginPath(); ctx.arc(0, 0, r*0.68, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(138,83,0,.85)';                    // dört uçlu yıldız kabartma
  ctx.beginPath();
  for (let i = 0; i < 4; i++){
    const a0 = i*Math.PI/2, a1 = a0 + Math.PI/4;
    ctx.lineTo(Math.cos(a0)*r*0.58, Math.sin(a0)*r*0.58);
    ctx.lineTo(Math.cos(a1)*r*0.21, Math.sin(a1)*r*0.21);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(-r*0.30, -r*0.44, r*0.30, r*0.16, -0.55, 0, TAU); ctx.fill();
  ctx.restore();
}

/* cam hissi veren HUD hapı: koyu zemin, ince üst ışık, alt gölge */
function pill(x, y, w, h, tone){
  ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2);
  const bg = ctx.createLinearGradient(0, y, 0, y+h);
  if (tone === 'gift'){ bg.addColorStop(0,'rgba(64,38,0,.86)'); bg.addColorStop(1,'rgba(36,20,0,.86)'); }
  else               { bg.addColorStop(0,'rgba(12,16,24,.52)'); bg.addColorStop(1,'rgba(6,9,14,.62)'); }
  ctx.fillStyle = bg; ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = tone === 'gift' ? 'rgba(255,201,60,.75)' : 'rgba(255,255,255,.34)';
  ctx.stroke();
  ctx.save();                                              // üstte ince ışık çizgisi
  ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,.13)';
  ctx.fillRect(x, y, w, h*0.42);
  ctx.restore();
}

function coinPill(x, y, text){
  ctx.save();
  ctx.font = '700 15px "Trebuchet MS", Verdana, sans-serif';
  const w = ctx.measureText(text).width + 42;
  const bump = 1 + coinPulse*0.10;
  ctx.translate(x, y); ctx.scale(bump, bump); ctx.translate(-x, -y);
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  pill(x, y-15, w, 30, 'dark');
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  coinIcon(x+17, y, 10 + coinPulse*1.2);
  ctx.fillStyle = '#fff';
  ctx.font = '700 15px "Trebuchet MS", Verdana, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(text, x+32, y+0.5);
  if (coinPulse > 0.02){                                   // artışta altın hâle
    ctx.globalAlpha = coinPulse*0.5;
    ctx.strokeStyle = '#ffd44d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x-2, y-17, w+4, 34, 17); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* tek seferlik hediye rozeti */
function giftPill(x, y){
  const a = Math.min(1, giftT/0.6);
  const txt = 'HEDİYE  +' + fmtCoin(Wallet.granted || 200);

  ctx.font = '700 13px "Trebuchet MS", Verdana, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

}

function drawHUD(){
  if (state === 'play' || state === 'dead'){
    ctx.save();
    ctx.translate(W/2, 88); ctx.scale(1 + pop*0.22, 1 + pop*0.22);
    outlined(String(score), 0, 0, 54, (hellActive || score >= CHAOS) ? '#ffd2c4' : '#fff');
    ctx.restore();
    if (hellActive || score >= CHAOS){                                    // nabız atan tehlike rozeti

  if (state === 'over'){

    ctx.fillStyle = '#5a4a1e'; ctx.font = '700 34px "Trebuchet MS", sans-serif';

    if (runNear > 0){                                        // madalyanın altında kıl payı künyesi
      const tierName = ['', 'KIL PAYI', 'EFSANE', 'İĞNE DELİĞİ'][clamp(runNearTier,1,3)];

      ctx.fillStyle = runNearTier >= 3 ? '#b07d15' : '#9c8a44';

      ctx.restore();
    }

    if (newBest){

      }
      coinIcon(W/2 - ew/2 - 12, py + ph + 24, earnFs*0.5);

    if (score >= 40){
      outlined('💎 MİTOLOJİK ELMAS MEKİK KAZANILDI! 💎', W/2, py + ph + (runEarn > 0 ? 48 : 24), 13, '#bbf2f6');
    } else if (score >= 30){
      outlined('🚀 EFSANEVİ ALTIN MEKİK KAZANILDI! 🚀', W/2, py + ph + (runEarn > 0 ? 48 : 24), 13, '#ffd700');
    }
    ctx.restore();

    if (overT > 0.55){
      const b = Math.sin(t*4)*3;
      const replayY = (score >= 30) && runEarn > 0 ? 456 : 442;
      outlined('DOKUN  ·  SPACE  ·  R    tekrar oyna', W/2, replayY + b, 17);

  }

  if (paused){
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0,0,W,H);
    outlined('DURAKLATILDI', W/2, H/2-14, 34, '#ffe45c');
    outlined('devam etmek için P', W/2, H/2+26, 17);
  }

  const isShopOpen = typeof Shop !== 'undefined' && typeof Shop.isOpen === 'function' && Shop.isOpen();
  const isCfgOpen = typeof Cfg !== 'undefined' && typeof Cfg.isOpen === 'function' && Cfg.isOpen();
  if (!isShopOpen && !isCfgOpen){
    coinPill(12, 66, fmtCoin(coinShown));
    if (giftT > 0) giftPill(12, 102);
    drawCoinPops();
  }
  iconBtn(BTN_SOUND.x, BTN_SOUND.y, Audio2.levels.muted ? 'mute' : 'sound');
  iconBtn(BTN_PAUSE.x, BTN_PAUSE.y, paused ? 'play' : 'pause');
}

    ctx.fillRect(0,0,W,H);
  }
  drawHUD();
}

const STEP = 1/120;
let acc = 0, last = performance.now(), ducked = false;
function frame(now){
  let dt = (now - last)/1000; last = now;
  dt = Math.min(dt, 0.1);
  if (slowMoT > 0){
    slowMoT = Math.max(0, slowMoT - dt);
    const k = 1 - slowMoT / (slowMoDur || 0.35);
    const factor = slowMoScale + (1 - slowMoScale) * Math.min(1, Math.max(0, k));
    dt *= clamp(factor, slowMoScale, 1);
  }
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 40){ update(STEP); acc -= STEP; }

  const wantDuck = paused || state === 'dead' || state === 'over';
  if (wantDuck !== ducked){ ducked = wantDuck; Audio2.duck(wantDuck); }

  render();
  requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);

/* ============================ PANELLER ============================ */
let panelPause = false;
function panelEnter(){ if (state === 'play' && !paused){ paused = true; panelPause = true; } }
function panelExit(){ if (panelPause){ paused = false; panelPause = false; } }

let toastTimer = null;
function showToast(msg, duration = 2400){
  const t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; toastTimer = null; }, duration);
}

/* ============================ AYARLAR ============================ */
const Cfg = (() => {
  const el = id => document.getElementById(id);
  const modal = el('modal');
  const def = { master: 70, sfx: 80, music: 35, muted: false };
  let v;
  try { v = Object.assign({}, def, JSON.parse(store.get('flappy.audio', '{}'))); }
  catch (e){ v = Object.assign({}, def); }
  function apply(){
    Audio2.setLevels({ master: v.master/100, sfx: v.sfx/100, music: v.music/100, muted: v.muted });
    el('vMaster').textContent = v.master + '%';
    el('vSfx').textContent    = v.sfx + '%';
    el('vMusic').textContent  = v.music + '%';
    el('sMaster').value = v.master;
    el('sSfx').value    = v.sfx;
    el('sMusic').value  = v.music;
    el('sMute').checked = v.muted;
    store.set('flappy.audio', JSON.stringify(v));
  }

  const api = {
    get levels(){ return v; },
    isOpen(){ return !modal.hidden; },
    open(on){
      modal.hidden = !on;
      if (on){ Audio2.unlock(); panelEnter(); } else panelExit();
    },
    toggleMute(){ v.muted = !v.muted; apply(); return v.muted; }
  };

  [['sMaster','master'], ['sSfx','sfx'], ['sMusic','music']].forEach(([id, key]) => {
    el(id).addEventListener('input', e => {
      v[key] = +e.target.value;
      if (v.muted && v[key] > 0 && key === 'master') v.muted = false;
      Audio2.unlock();
      apply();
    });
  });
  el('sMute').addEventListener('change', e => { v.muted = e.target.checked; Audio2.unlock(); apply(); });
  el('sClose').addEventListener('click', () => api.open(false));
  const rBtn = el('sReset');
  if (rBtn){
    rBtn.addEventListener('click', () => {
      if (confirm('Flappy Plane rekorunuzu, tüm açılan kostümleri (Altın Mekik dahil) ve biriken coinleri sıfırlamak istediğinize emin misiniz?')){
        resetAllProgress();
        api.open(false);
        if (typeof showToast === 'function') showToast('🧹 Bütün ilerleme ve Altın Mekik sıfırlandı!');
      }
    });
  }
  el('gear').addEventListener('click', () => api.open(true));
  modal.addEventListener('pointerdown', e => { if (e.target === modal) api.open(false); });
  apply();
  return api;
})();

/* ============================ MAĞAZA ============================ */
const Shop = (() => {
  const el = id => document.getElementById(id);
  const modal = el('shopModal'), grid = el('skinGrid'), row = el('tintRow');
  let built = false, shopRaf = null;

  function preview(cv, skin, time = 1.05, boost = 0){
    const d = cv.getContext('2d');
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = 150, ch = 98;
    if (cv.width !== Math.round(cw*dpr) || cv.height !== Math.round(ch*dpr)){
      cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
    }
    d.setTransform(dpr,0,0,dpr,0,0);

    if (skin.unlockScore){
      const lg = d.createLinearGradient(0,0,0,ch);
      if (skin.id === 'diamond_shuttle'){
        lg.addColorStop(0, '#020b18'); lg.addColorStop(0.5, '#06203d'); lg.addColorStop(1, '#0e3a5a');
        d.fillStyle = lg; d.fillRect(0,0,cw,ch);
        d.fillStyle = '#bbf2f6';
        d.fillRect(20, 14, 2, 2); d.fillRect(128, 20, 2, 2); d.fillRect(40, 76, 1.5, 1.5); d.fillRect(115, 65, 1.5, 1.5);
      } else {
        lg.addColorStop(0, '#0c1224'); lg.addColorStop(0.55, '#22193e'); lg.addColorStop(1, '#522438');
        d.fillStyle = lg; d.fillRect(0,0,cw,ch);
        // Minik kozmik yıldızlar
        d.fillStyle = '#fff6b2';
        d.fillRect(18, 16, 2, 2); d.fillRect(130, 22, 2, 2); d.fillRect(36, 74, 1.5, 1.5); d.fillRect(118, 68, 1.5, 1.5);
      }
    } else {
      const g = d.createLinearGradient(0,0,0,ch);
      g.addColorStop(0, '#5fa8d3'); g.addColorStop(0.55, '#a2d2ff'); g.addColorStop(1, '#cae9ff');
      d.fillStyle = g; d.fillRect(0,0,cw,ch);
      d.fillStyle = '#6ab43e'; d.fillRect(0,ch-14,cw,14);
      d.fillStyle = '#c7be77'; d.fillRect(0,ch-6,cw,6);
    }

    d.save();
    const bob = Math.sin(time * 2.5) * 2;
    d.translate(cw/2, ch/2 - 4 + bob);
    d.scale(1.25, 1.25);
    skin.art(d, time, boost, palette(skin.id, Wallet.tint));
    d.restore();
  }

  function shopLoop(){
    if (modal.hidden){ shopRaf = null; return; }
    const now = performance.now() / 1000;
    grid.querySelectorAll('.card').forEach(card => {
      const cv = card.querySelector('canvas');
      const sk = skinById(card.dataset.id);
      if (cv && sk) preview(cv, sk, now * 3.5, 0);
    });
    shopRaf = requestAnimationFrame(shopLoop);
  }

  function build(){
    grid.innerHTML = ''; row.innerHTML = '';
    SKINS.forEach(sk => {
      const b = document.createElement('button');
      b.className = 'card' + (sk.unlockScore ? ' legend' : '') + (sk.id === 'diamond_shuttle' ? ' diamond' : '');
      b.dataset.id = sk.id;
      const isOwned = Wallet.owns(sk.id);
      b.innerHTML = `
        <div class="preview-wrap">
          <canvas></canvas>
          <span class="badge ${sk.badgeCol || 'blue'}">${sk.badge || ''}</span>
          <span class="lock-icon" title="Kilitli"${isOwned ? ' hidden style="display:none"' : ''}>🔒</span>
        </div>
        <div class="info">
          <span class="nm">${sk.name}</span>
          <span class="desc">${sk.desc || ''}</span>
          <span class="pr"></span>
        </div>
      `;
      b.addEventListener('click', () => pick(sk.id, sk.price, 'skin', b));
      grid.appendChild(b);
    });
    TINTS.forEach(tn => {
      const b = document.createElement('button');
      b.className = 'tint' + (tn.id === 'diamond' ? ' diamond-tint' : '');
      b.dataset.id = tn.id;
      b.innerHTML = '<i></i><span></span>';
      b.title = tn.name;
      b.addEventListener('click', () => pick(tn.id, tn.price, 'tint', b));
      row.appendChild(b);
    });
    built = true;
  }

  function pick(id, price, kind, node){
    const owned = Wallet.owns(id);
    if (!owned){
      const sk = kind === 'skin' ? skinById(id) : null;
      if (sk && sk.unlockScore){
        Audio2.deny();
        node.classList.remove('nope'); void node.offsetWidth; node.classList.add('nope');
        const bestScore = +(store.get('flappy.best', 0)) || 0;
        showToast(`🔒 ${sk.name} kilitli! Sadece ${sk.unlockScore} skora ulaşanlar kazanabilir. (En iyi: ${bestScore}/${sk.unlockScore})`);
        const pr = node.querySelector('.pr');
        if (pr){
          pr.textContent = sk.unlockScore + ' SKOR GEREKİR!';
          setTimeout(() => { if (!Wallet.owns(id)) pr.textContent = '🔒 ' + sk.unlockScore + ' SKOR'; }, 1400);
        }
        return;
      }
      if (!Wallet.buy(id, price)){
        Audio2.deny();
        node.classList.remove('nope'); void node.offsetWidth; node.classList.add('nope');
        if (typeof showToast === 'function') showToast(`⚠️ Yetersiz coin! (${fmtCoin(price)} gerekir)`);
        return;
      }
      Audio2.popper();
      confettiAdd(W/2, SKY_H*0.4, 30, 340, Math.PI, 0);
      if (id === 'diamond'){
        showToast('💎 BÜTÜN MODELLER İÇİN ELMAS RENGİ AÇILDI!');
      } else {
        showToast(`🎉 ${sk ? sk.name : 'Yeni Renk'} Kilidi Açıldı!`);
      }
    } else {
      Audio2.score(1.2);
    }
    if (kind === 'skin') Wallet.equipSkin(id); else Wallet.equipTint(id);
    refresh();
  }

  function refresh(){
    el('shopCoins').textContent = fmtCoin(Wallet.coins);
    const activeSkin = skinById(Wallet.skin);

    // noTint kostümler için renk uyarısı
    const tintNoteEl = el('tintNote');
    if (tintNoteEl){
      tintNoteEl.hidden = !activeSkin.noTint;
      if (activeSkin.noTint) tintNoteEl.textContent = `${activeSkin.name} kendi efsanevi rengini korur.`;
    }
    row.classList.toggle('disabled', !!activeSkin.noTint);

    grid.querySelectorAll('.card').forEach(card => {
      const sk = skinById(card.dataset.id);
      const owned = Wallet.owns(sk.id), active = Wallet.skin === sk.id;
      card.classList.toggle('owned', owned);
      card.classList.toggle('active', active);
      card.classList.toggle('legend', !!sk.unlockScore);
      card.classList.toggle('diamond', sk.id === 'diamond_shuttle');
      card.classList.toggle('locked', !owned && !!sk.unlockScore);

      const lockIcon = card.querySelector('.lock-icon');
      if (lockIcon){
        lockIcon.hidden = owned;
        lockIcon.style.display = owned ? 'none' : 'flex';
      }

      const badge = card.querySelector('.badge');
      if (badge){
        badge.hidden = !sk.badge;
        badge.textContent = sk.badge || '';
      }

      const pr = card.querySelector('.pr');
      if (active){
        pr.textContent = 'KULLANILIYOR';
        pr.classList.remove('cost');
      } else if (owned){
        pr.textContent = 'sahipsin';
        pr.classList.remove('cost');
      } else if (sk.unlockScore){
        pr.textContent = '🔒 ' + sk.unlockScore + ' SKOR';
        pr.classList.remove('cost');
      } else {
        pr.textContent = fmtCoin(sk.price);
        pr.classList.add('cost');
      }
      preview(card.querySelector('canvas'), sk);
    });

    row.querySelectorAll('.tint').forEach(sw => {
      const tn = tintById(sw.dataset.id);
      const owned = Wallet.owns(tn.id), active = Wallet.tint === tn.id;
      sw.classList.toggle('owned', owned);
      sw.classList.toggle('active', active);
      sw.classList.toggle('diamond-tint', tn.id === 'diamond');
      sw.style.setProperty('--c', tn.color || skinById(Wallet.skin).base);
      if (tn.gradient){
        const iEl = sw.querySelector('i');
        if (iEl) iEl.style.background = tn.gradient;
      }
      const ts = sw.querySelector('span');
      ts.textContent = active ? '✓' : (owned ? tn.name : fmtCoin(tn.price));
      ts.classList.toggle('cost', !owned);
    });
  }

  const api = {
    isOpen(){ return !modal.hidden; },
    open(on){
      if (on){
        if (typeof Cfg !== 'undefined' && Cfg.isOpen()) Cfg.open(false);
        if (!built) build();
        refresh();
        Audio2.unlock();
        panelEnter();
        if (!shopRaf) shopRaf = requestAnimationFrame(shopLoop);
      } else {
        if (shopRaf){ cancelAnimationFrame(shopRaf); shopRaf = null; }
        panelExit();
      }
      modal.hidden = !on;
    },
    refresh
  };
  el('shopBtn').addEventListener('click', () => api.open(true));
  el('shopClose').addEventListener('click', () => api.open(false));
  modal.addEventListener('pointerdown', e => { if (e.target === modal) api.open(false); });
  return api;
})();



/* ============================ GİRDİ ============================ */
function toCanvas(e){
  const r = cvs.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function near(pt, b){ return Math.hypot(pt.x-b.x, pt.y-b.y) < 22; }

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  const pt = toCanvas(e);
  if (near(pt, BTN_SOUND)){ Audio2.unlock(); Cfg.toggleMute(); return; }
  if (near(pt, BTN_PAUSE)){ if (state === 'play' || paused) paused = !paused; return; }
  flap();
});
addEventListener('keydown', e => {
  if (Cfg.isOpen() || Shop.isOpen()){
    if (e.code === 'Escape' || e.code === 'KeyS' || e.code === 'KeyK'){
      e.preventDefault();
      if (Cfg.isOpen()) Cfg.open(false);
      else Shop.open(false);
    }
    if (e.code === 'Space') e.preventDefault();
    return;
  }
  if (e.repeat && e.code !== 'Space') return;
  switch (e.code){
    case 'Space': case 'ArrowUp': case 'KeyW': e.preventDefault(); if (!e.repeat) flap(); break;
    case 'KeyP': case 'Escape': if (state === 'play' || paused) paused = !paused; break;
    case 'KeyM': Audio2.unlock(); Cfg.toggleMute(); break;
    case 'KeyS': Cfg.open(true); break;
    case 'KeyK': Shop.open(true); break;
    case 'KeyH': {
      const active = toggleHellMode();
      showToast(active ? '🔥 Cehennem Modu Açıldı!' : '🌤️ Sakin Gökyüzü Modu Açıldı!');
      break;
    }
    case 'KeyR': if (state === 'over' || state === 'dead'){ Audio2.swoosh(); reset(); } break;
  }
});
addEventListener('blur', () => { if (state === 'play') paused = true; });
// Mobilde uygulama arka plana alınınca oyun beklesin (sekme değişimi, telefon kilidi…)
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'play') paused = true;
});

/* ==================== YEDEK / GERİ YÜKLEME ====================
   Tüm ilerleme localStorage'da tutulur; aşağıdaki kod onu taşınabilir
   tek bir metin koduna çevirir (FP1:<base64 JSON>). */
const SaveIO = (() => {
  const KEYS = ['flappy.wallet', 'flappy.best', 'flappy.nearcombo', 'flappy.audio'];
  const b64e = str => btoa(String.fromCharCode(...new TextEncoder().encode(str)));
  const b64d = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));

  function exportCode(){
    const data = {};
    KEYS.forEach(k => { const v = store.get(k, null); if (v !== null) data[k] = v; });
    return 'FP1:' + b64e(JSON.stringify({ v: 1, at: new Date().toISOString().slice(0,10), data }));
  }
  function importCode(code){
    const raw = String(code || '').trim().replace(/\s+/g, '');
    if (!raw.startsWith('FP1:')) throw new Error('Kod "FP1:" ile başlamalı.');
    const obj = JSON.parse(b64d(raw.slice(4)));
    if (!obj || typeof obj.data !== 'object' || obj.data === null) throw new Error('Kod okunamadı.');
    const keys = Object.keys(obj.data).filter(k => KEYS.includes(k));
    if (!keys.length) throw new Error('Kodda kayıtlı ilerleme yok.');
    if (obj.data['flappy.wallet']) JSON.parse(obj.data['flappy.wallet']);   // bozuk kodu erken yakala
    keys.forEach(k => store.set(k, String(obj.data[k])));
    return keys.length;
  }
  return { exportCode, importCode };
})();

(function wireSaveUI(){
  const box = document.getElementById('saveCode');
  const btnE = document.getElementById('sExport');
  const btnI = document.getElementById('sImport');
  if (!box || !btnE || !btnI) return;

  btnE.addEventListener('click', async () => {
    const code = SaveIO.exportCode();
    box.value = code;
    box.focus(); box.select();
    let copied = false;
    try { await navigator.clipboard.writeText(code); copied = true; } catch(e){
      try { copied = document.execCommand('copy'); } catch(e2){}
    }
    showToast(copied ? '📤 Yedek kodu kopyalandı — güvenli bir yere kaydet.'
                     : '📤 Yedek kodu hazır — kutudaki metni kopyala.', 3200);
  });

  btnI.addEventListener('click', () => {
    const code = box.value.trim();
    if (!code){ showToast('Önce yedek kodunu kutuya yapıştır.'); Audio2.deny(); return; }
    try {
      const n = SaveIO.importCode(code);
      showToast('📥 Yedek yüklendi (' + n + ' kayıt) — oyun yenileniyor…', 1600);
      setTimeout(() => location.reload(), 900);
    } catch(err){
      Audio2.deny();
      showToast('❌ Yedek yüklenemedi: ' + err.message, 3600);
    }
  });
})();

/* ==================== PWA: kurulum, çevrimdışı, kalıcı depolama ==================== */
(function pwa(){
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  // 1) Uygulama künyesi dosya dışında tutulmaz: burada üretilip sayfaya bağlanır,
  //    böylece oyun tek bir HTML dosyası olarak paylaşılabilir. (Android'de tam ekran kurulum.)
  try {
    const icon = document.querySelector('link[rel="icon"]').href;
    const mf = {
      name: 'Flappy Plane', short_name: 'Flappy Plane', lang: 'tr',
      start_url: location.href.split('#')[0], scope: './',
      display: 'standalone', orientation: 'portrait',
      background_color: '#0d1018', theme_color: '#0d1018',
      icons: [{ src: icon, sizes: '192x192', type: 'image/png', purpose: 'any' },
              { src: icon, sizes: '192x192', type: 'image/png', purpose: 'maskable' }]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: 'application/manifest+json' }));
    document.head.appendChild(link);
  } catch(e){}

  // 1b) Aynı klasörde sw.js varsa çevrimdışı da açılsın; yoksa sessizce atlanır.
  //     (Güvenli bağlam şart: https ya da localhost.)
  const secure = location.protocol === 'https:' ||
                 ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  if ('serviceWorker' in navigator && secure){
    addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }

  // 2) Depolama kalıcı olsun (Chrome/Android: tarayıcı yer açarken silmez)
  if (navigator.storage && navigator.storage.persist){
    navigator.storage.persisted().then(ok => { if (!ok) navigator.storage.persist().catch(() => {}); })
      .catch(() => {});
  }

  // 3) Android/Chrome kurulum istemi
  const btn = document.getElementById('installBtn');
  let deferred = null;
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    if (btn) btn.hidden = false;
  });
  if (btn){
    btn.addEventListener('click', async () => {
      if (deferred){
        deferred.prompt();
        const res = await deferred.userChoice.catch(() => null);
        deferred = null; btn.hidden = true;
        if (res && res.outcome === 'accepted') showToast('📲 Ana ekrana eklendi!');
      } else {
        showToast('iPhone/iPad: Safari\'de Paylaş ▸ "Ana Ekrana Ekle" adımını kullan.', 4200);
      }
    });
    // iOS\'ta beforeinstallprompt yok; yönergeyi düğmeyle göster
    const iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (iOS && !standalone) btn.hidden = false;
  }
  addEventListener('appinstalled', () => { if (btn) btn.hidden = true; });
})();

/* ==================== GELİŞTİRME: canlı yenileme ==================== */
(function(){
  const local = ['localhost','127.0.0.1','[::1]'].includes(location.hostname);
  if (location.protocol.indexOf('http') !== 0 || !local) return;
  let stamp = null;
  setInterval(async () => {
    try{
      const r = await fetch(location.href, { method:'HEAD', cache:'no-store' });
      const m = r.headers.get('Last-Modified');
      if (stamp && m && m !== stamp) location.reload();
      stamp = m;
    }catch(e){}
  }, 900);
})();
